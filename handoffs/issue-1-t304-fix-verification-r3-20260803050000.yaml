findings:
  - id: T304-R4-P1
    severity: medium
    origin: introduced_by_fix
    location: src/ui/pr-progress/pull-request-progress-tree-data-provider.ts defineEffectiveFile/getEffectiveProgress; test/unit/pull-request-progress-tree.test.ts
    description: Required effective DTO fields are non-enumerable on a raw-shaped object, so ordinary clone/serialization erases effective evidence and exposes undeclared raw fields.
    impact: Consumers can silently lose reviewability, category, reason, and raw/effective distinction, reintroducing the R3-P2 ambiguity at runtime.
    evidence: Object.defineProperties sets raw/reviewability/category/effectiveReason enumerable=false; existing deep-equality expects raw projected shape.
    required_action: Return a plain enumerable DTO matching PullRequestEffectiveFileProgress, deep-clone nested raw evidence, and add spread/Object.keys/JSON regression tests.
  - id: T304-R4-P2
    severity: medium
    origin: introduced_by_change
    location: src/ui/pr-progress/pull-request-progress-tree-data-provider.ts validateNonEmpty/validateFile
    description: trim-based path validation rejects valid POSIX root filenames consisting only of spaces.
    impact: A valid Git change cannot be represented in the PR Progress Tree or opened from it.
    evidence: Canonical POSIX path validator accepts nonempty space filenames; T304 calls trim() for path fields.
    required_action: Separate path validation from trimmed ID/label validation, apply canonical filesystem semantics, and add POSIX/Windows whitespace tests.
  - id: T304-R4-P3
    severity: medium
    origin: introduced_by_fix
    location: src/ui/diff-editor/review-diff-editor-controller.ts ReviewDiffEditorSideInput/openReviewDiff
    description: Unknown runtime side kind values are treated as present Git sides because only kind===absent is tested.
    impact: Malformed or future inputs fail open into Git access instead of being rejected as contract violations.
    evidence: value.kind === "absent" ? "empty" : "git-commit"; no runtime kind validation or test.
    required_action: Accept only undefined/present/absent, reject every other runtime value before URI or host calls, and add regression tests.

