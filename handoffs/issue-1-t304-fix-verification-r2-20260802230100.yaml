findings:
  - id: T304-R3-P1
    severity: medium
    origin: coverage_miss
    location: src/ui/pr-progress/pull-request-progress-tree-data-provider.ts select/openTarget; src/application/diff-document/revision-text-content-provider.ts
    description: Line-review unsupported nodes remain selectable and always invoke text diff opening, but invalid encoding and binary content cannot be restored by the text provider.
    impact: Explicit T304 selection acceptance fails for the unsupported category and the UI exposes an action that rejects at runtime.
    evidence: select unconditionally calls host.openDiff; invalid-encoding is thrown as RevisionTextContentProviderError; no unsupported selection test exists.
    required_action: Define unsupported selection behavior, implement viewer/placeholder or non-selectable contract, update design/task when needed, and add binary/encoding selection tests.
  - id: T304-R3-P2
    severity: medium
    origin: introduced_by_fix
    location: src/ui/pr-progress/pull-request-progress-tree-data-provider.ts projectFileProgress/getEffectiveProgress; src/core/pr-progress/pr-diff-progress.ts
    description: Projected effective data is exposed as raw PullRequestDiffProgress even though unsupported files retain nonzero additions/deletions and excluded=false while totalLineCount is zero and reviewability is absent.
    impact: Downstream consumers cannot distinguish raw T301 data from T304 projection or explain broken raw invariants.
    evidence: getEffectiveProgress returns PullRequestDiffProgress and the T304 consumer fixture positively fixes that assignment.
    required_action: Introduce a distinct effective/projected progress contract carrying reviewability or expose a dedicated aggregate summary; add negative raw/effective type tests.
  - id: T304-R3-P3
    severity: medium
    origin: introduced_by_fix
    location: src/application/diff-document/contracts.ts; src/adapters/diff-document/local-git-revision-text-content-source.ts; design 8.2-8.4
    description: Descriptor revisionSource was widened to empty, but the content source port accepts the widened descriptor and the public LocalGit source ignores revisionSource, so direct and provider-mediated calls give different results for the same empty descriptor; design and T302 fixture remain git-only.
    impact: Public source substitutability and URI/source semantics are inconsistent and future source implementations can mis-handle empty documents.
    evidence: RevisionTextContentProvider short-circuits empty to an empty string while LocalGitRevisionTextContentSource directly reads Git for the same descriptor shape.
    required_action: Narrow the external source port with a discriminated descriptor or make all sources consistently handle/reject empty; update T302 fixtures and design.

