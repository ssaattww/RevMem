findings:
  - id: I124-R001
    severity: high
    origin: introduced_by_change
    location: src/composition/global-understanding/global-understanding-source.ts; src/ui/global-understanding/global-understanding-ui-model.ts
    description: failed scope state is updated in the controller but current refresh failure clears the Tree instead of publishing the failed row
    impact: failed warning and restart action are unavailable after collection failure
    evidence: folderScopes.fail is followed by throw; GlobalUnderstandingRefreshController catch calls host.clear
    required_action: publish the current failed folder state and cover actual source plus runtime provider failed-row behavior
  - id: I124-R002
    severity: high
    origin: introduced_by_change
    location: src/composition/global-understanding/global-understanding-source.ts; src/ui/global-understanding/vscode-global-understanding-runtime.ts
    description: each running publication uses an empty snapshot, replacing previously known file rows until enumeration completes
    impact: file list disappears during collection, preserving the user-visible problem while spinner is active
    evidence: publishProgress(emptySnapshot) precedes enumeration; runtime replaces the Tree model for progress publications
    required_action: retain known path-only file rows during running publication or separate lifecycle publication from file snapshot replacement
  - id: I124-R003
    severity: medium
    origin: introduced_by_change
    location: src/ui/global-understanding/global-understanding-ui-model.ts
    description: validateDiscoveredFilePaths scans all discovered and progress paths synchronously before the first scheduler yield
    impact: large repositories can block the Extension Host and violate the deterministic item budget
    evidence: 10000 path-only probe first yielded after 10128 path accesses with maxFilesPerStage 128
    required_action: make discovered-path validation cooperative and add a 10000 path-only bounded-stage regression fixture
