      ## 指摘の確認結果


      ### PDS06-NR1-001 / P2・medium — fixed


      元の問題は、PRのheadとGlobalの現在改訂が異なるとき、PR側のGlobalだけを変更する操作が `no-op` となり、確認状態の不一致と履歴欠落が残ることだった。originは `introduced_by_change`。元の位置は
      `diff-editor-review-command-service.ts:88-94,234-237,300-303`。

      今回の修正では独自のファイル限定比較を削除し、`commitWhenChanged` がcoreの `hasReviewStateSemanticChange` を使用する。比較はContext・Globalの改訂別snapshotを含み、生成時刻だけの違いは無視する。core側の改訂投影・現在Globalの保持処理は変更していない。

      常設テストの左右×確認／解除4ケースを実行した。さらに実PR runtimeへ製品の履歴境界・ReviewHistoryRecorderを接続し、現在改訂がPR headと同じ場合／異なる場合の計8ケースを確認した。

      全ケースで保存1回・履歴要求1回、変更対象のPR snapshot更新、modified履歴1件、ContextとGlobalの正しい変更前後を確認。異なる現在改訂のGlobal.filesとcurrentRevisionIdは不変だった。続けて同じ操作を行うと
      `no-op` となり、保存・履歴は増えなかった。


      ### PDS06-NR1-002 / P2・medium — fixed


      元の問題は、sideとblockが同じ履歴reasonとevent typeになり、追加のみなど履歴が1件の操作を保存後に識別できないことだった。originは `introduced_by_change`。元の位置は
      `src/composition/extension.ts:615-623` と `review-history-recorder.ts:51-60,97-120`。

      今回追加された `src/composition/pull-request/pull-request-review-history.ts` が、blockの確認／解除を `user-block-selection`
      として記録する。modified側の既存side範囲操作は `user-selection`、その他の既存fallbackは `user-file` を維持する。元側の旧side操作を新たに別分類へ変更したとは扱わない。

      `extension.ts` がこの境界へ委譲することと、実際の境界からrecorderへ渡されたイベントを確認した。追加のみのside/block×確認／解除4ケース、置換の1成分だけが変わる左右×確認／解除×変更成分8ケース、両側が変わる4ケース、削除のみ2ケースが成功した。

