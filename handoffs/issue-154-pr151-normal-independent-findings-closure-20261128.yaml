      "content_type": "text/markdown",
      "payload": "# RevMem #154 / PR #151 独立最終レビュー\n\n**判定：`fail` — 必須指摘3件（Medium 3件）**\n\n指定された凍結版に対する独立レビューを一巡完了しました。自動CIは成功していますが、Viewed表示の失効境界、取消時の表示復元、必須試験に不備が残っています。現時点では独立最終レビューの合格報告を確定できません。\n\n## 1. レビュー対象と同一性\n\n| 項目 | 確認結果 |\n|---|---|\n| Repository | `ssaattww/RevMem` |\n| Issue | [#154](https://github.com/ssaattww/RevMem/issues/154) |\n| PR | [Draft PR #151](https://github.com/ssaattww/RevMem/pull/151) |\n| Branch | `task/issue-93-github-viewed-sync-design` |\n| Base | `main` / `1a25b982ae42490e9cb609108ac0372dad82d333` |\n| Reviewed implementation HEAD | `53aac0142e553dd1b24b99e7eab22262bfd08ca9` |\n| Commit range | Baseから7コミット、32ファイル、+3,248 / −66行 |\n| 対象の安定性 | レビュー開始時・終了時でHEAD一致 |\n| レビュー方式 | `independent_final_review` |\n| 独立性 | 本担当は実装・修正実装・通常レビューに不参加 |\n| 実行方式 | `single_agent` / decomposition forbidden |\n\nGitHub上の全32ファイルの差分・変更行数と、隔離済みローカルコピーの全32ファイルのGit blob SHAを照合しました。\n\n実際の変更を先に確認し、独立所見を形成した後に通常レビュー記録を比較根拠として読みました。\n\n## 2. 独立レビューの必須指摘\n\n### I154-IFR-001 — PR差分エディタで非同期選択切替時の失効ガードが不足\n\n**重大度：Medium / 必須**  \n**Origin：`introduced_by_change`**\n\n**対象：**\n\n- `src/composition/extension.ts:214–218,635–640,870–891`\n- `src/composition/pull-request/pull-request-review-runtime.ts:142–172`\n- `src/application/review-commands/diff-editor-review-command-service.ts:170–176,258–288`\n\nPR差分エディタの操作は、開始時点で選択中のContextがPRである場合にだけViewed失効ガードを取得しています。\n\n一方、PR差分操作の実際の保存対象は差分文書の登録情報から解決され、現在選択中のContextと同一であることは必須ではありません。\n\nそのため、次の順序が成立します。\n\n1. Branch Context選択中に、登録済みPR差分の確認解除操作を開始する。\n2. 非同期の保存処理中に対象PRが選択される。\n3. Viewed状態が取得・表示される。\n4. 確認解除が保存されるが、その後の履歴記録が失敗する。\n5. 操作開始時にガードが存在せず、`applied` にもならないため、古いViewed表示が残る。\n\n凍結HEADとblob一致した実装からガード・同期処理を抽出した、メモリ上の焦点モックで以下を確認しました。\n\n```text\nlabel: UNVIEWED\nrefreshCalls: 0\npersisted: incomplete\n```\n\nこれは実機試験ではありませんが、当該失効経路の欠落を示す再現根拠です。\n\n**必要な対応：** PR差分操作についても、開始時のContextだけに依存せず、実際の対象・非同期選択切替・保存終了まで失効ガードを維持すること。保存成功後の履歴記録失敗も含む回帰試験を追加すること。\n\n通常指摘 `I93-NR-004` の通常エディタ修正と同種の、別の操作経路に残る問題です。\n\n---\n\n### I154-IFR-002 — 取消・no-op操作後、正常なViewed表示が消失したままとなる\n\n**重大度：Medium / 必須**  \n**Origin：`introduced_by_change`**\n\n**対象：**\n\n- `src/composition/pull-request/github-viewed-display-controller.ts:9–27`\n- `src/composition/extension.ts:209–218,635–640,1032–1034`\n- `src/ui/normal-editor/review-command-registration.ts:99–114`\n\n操作開始時に表示が失効しますが、正常な取消やno-opでは再取得が起動しません。\n\n例えば、正しくViewedが表示されたPRで全ファイル確認解除を開始し、確認ダイアログを取り消すと、ローカル状態もGitHub状態も変わっていないにもかかわらず、表示だけが消失します。\n\n焦点モックで次を確認しました。\n\n```text\nlabel: undefined\nrefreshCalls: 0\npersisted: completed\n```\n\n**必要な対応：** 正常な取消・no-op時には古い応答を復活させず、必要に応じて現在の選択と永続状態から新しいViewed表示を取得すること。保存失敗時の安全側の失効とは区別し、通常エディタ・PR差分エディタ・文書編集の対象経路を試験すること。\n\n---\n\n### I154-IFR-003 — 更新禁止・取得失敗の必須試験が不十分\n\n**重大度：Medium / 必須**  \n**Origin：`introduced_by_change`**\n\n**対象：**\n\n- `doc/design/issue-93-github-viewed-sync.md:46–52`\n- `test/unit/fetch-github-pull-request-viewed-adapter.test.ts`\n- `test/unit/fetch-github-pull-request-viewed-identity-adapter.test.ts`\n- `test/unit/github-viewed-display-controller.test.ts`\n- `test/unit/pull-request-progress-tree.test.ts`\n\n製品コードを静的に追跡した結果、実際のGitHubアクセスはGraphQL `query` とRESTのmerge-base読み取りに限定され、更新処理を発見していません。\n\nただし、設計で明記された「更新APIが一度も呼ばれない」「認証・GraphQL失敗時は取得不可」という試験について、新規アダプタのモックには次の不足があります。\n\n- GraphQLのURL確認はあるが、送信された操作が読み取り専用であることを検証していない。\n- 新規取得経路の認証拒否・GraphQLエラー・通信失敗から、実際の表示経路の `取得不可` に至る確認が不足している。\n- 個別コンポーネントの試験はあるが、それらを接続する製品側の経路での必須条件を十分に証明していない。\n\n**必要な対応：** 実際の取得・表示接続を使用した模擬試験で、許可対象においても読み取り専用であること、失敗時の取得不可表示、ローカルレビュー状態・履歴が変更されないことを明示的に検証すること。\n\n## 3. 必須11観点の評価\n\n| 観点 | Disposition | 根拠 |\n|---|---|---|\n| 要求・設計適合 | `checked_finding` | 第1段階のみだが、失効・表示復元・設計必須試験に不足 |\n| 正当性・境界条件 | `checked_finding` | IFR-001、002 |\n| スコープ・無関係な変更 | `checked_no_finding` | #154に限定。#93の更新処理なし |\n| 全変更ファイル・直接依存 | `checked_finding` | 全32ファイル照合。差分操作の直接依存からIFR-001を確認 |\n| API・データ・設定・互換性・Workflow | `checked_no_finding` | 既定OFF、application scope、GitHub.com限定、既存CI利用 |\n| エラー処理・診断 | `checked_finding` | 履歴記録失敗時の失効および取得失敗の試験不足 |\n| セキュリティ・秘密情報管理 | `checked_no_finding` | 固定HTTPS取得先、redirect拒否、silent認証、秘密情報表示なし |\n| テスト・検証の十分性 | `checked_finding` | IFR-003、IFR-001・002の回帰試験不足 |\n| 現在HEADのCI | `checked_no_finding` | 指定run、HEAD、PR、全成功を確認 |\n| 報告・追跡・文書の正確性 | `checked_no_finding` | 通常工程記録と独立工程を区別 |\n| 回帰・保守性 | `checked_finding` | 非同期操作間のガード適用範囲、取消後の再取得不足 |\n\n## 4. 問題なしと確認した重点事項\n\n- 設定の既定値は空配列で、Viewed連携はOFF。\n- 本人のviewer IDとlogin、GitHub.com、対象owner/repositoryを照合してからファイル取得する。\n- 同じ認証セッションでPR固有ID・head・merge-base・originalDiffIdを検証する。\n- 完全な変更ファイル一覧を照合し、部分一致で表示しない。\n- 改名・コピー等、同一性を証明できない場合は安全側に非表示とする。\n- ローカル全変更行の完了状態とGitHub側Viewedを区別し、同期適格性は常に`false`。\n- GitHub書き込み、Approve、コメント、Unview、マージ処理を追加していない。\n- Viewed表示自体は一時的なOverlayであり、レビュー状態を保存する処理を持たない。\n\n確認対象は製品ソース15ファイル、試験11ファイル、設定1ファイル、設計1ファイル、通常報告・引継ぎ2ファイル、追跡2ファイルです。直接依存についても、認証・タイムアウト・merge-base取得・現在Context・PR進捗・永続化・差分操作・履歴・CI設定等の関連する29ファイルをGitHubのblobと照合しました。\n\n## 5. 自動CI・通常レビューとの比較\n\n### 確定版CI\n\n| 項目 | 結果 |\n|---|---|\n| Run | [46077821254](https://github.com/ssaattww/RevMem/actions/runs/46077821254) |\n| `head_sha` | `53aac0142e553dd1b24b99e7eab22262bfd08ca9` — 完全一致 |\n| Event | `pull_request`、PR #151 |\n| Status / Conclusion | `completed` / `success` |\n| Job | [build-and-lint](https://github.com/ssaattww/RevMem/actions/runs/46077821254/job/140769585070) |\n| Steps | 成功39、失敗時診断skip 2 |\n| Artifact | `review-range-user-validation-0.1.65-pre+53aac01` |\n| Artifact ID | `15235113731` |\n\nWorkflow自身がPRのHEAD SHAを指定してcheckoutしています。CI設定・依存lockfileの変更もありません。\n\n### 通常工程の確認\n\n通常統合記録および通常引継ぎを確認しました。技術版 `4f0726181e540da33b69131bbe700ebbafeb4eba` から凍結HEADまでの差分は、通常報告・引継ぎ・追跡の4ファイルのみです。\n\n既存の通常指摘 `I93-NR-001`〜`006` の履歴と重大度は変更しません。今回の3件は独立レビューで発見した追加指摘です。\n\n全ローカル試験の再実行は行わず、必要な焦点モックのみを、GitHubのblobと一致したソースからメモリ上で実行しました。\n\n## 6. 保留・未調査\n\n**保留事項：**\n\n- 本人の実GitHubアカウントでの認証・取得。\n- 本人端末の実VS Code画面における表示・操作。\n- 外部でViewed状態が変化した場合の、実サービス上での更新タイミング。\n- 初回実装全体のRed試験の時系列証跡。既存通常記録でも独立確認されていません。\n\n実体験の確認は利用者環境の検証担当に帰属します。CIのExtension Host試験を本人実機確認済みとは扱いません。\n\n**判定を妨げる