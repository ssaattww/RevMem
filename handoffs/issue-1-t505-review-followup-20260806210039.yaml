              - T504 configurationKey uses the shared policy revision.
            tests:
              - A valid exclusion followed by an invalid setting retains identical Global denominator and pruned diagnostics.
          - id: T505-R004
            severity: Medium
            disposition: addressed
            summary: Invalid or unsafe snapshot setting values could throw during extension activation.
            changes:
              - Resolver accepts unknown runtime values and falls back to the manifest default.
              - Manifest caps the setting at Number.MAX_SAFE_INTEGER.
