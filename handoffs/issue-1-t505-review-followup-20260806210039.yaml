  findings:
    - id: T505-R001
      severity: High
      disposition: addressed
      summary: Global understanding ignored unsaved VS Code buffers and lacked change/save/close refresh.
      changes:
        - Capture immutable open TextDocument evidence with path, revision, version, line count, non-empty lines, hash, and cache key.
        - Replace both denominator evidence and T504 file source evidence for open files from the same snapshot.
        - Subscribe Global recalculation to change, save, and close events.
        - Reject stale open-document snapshots through validateCurrent.
      tests:
        - T505-R001 prefers immutable open-document evidence and switches to disk after save and close.
        - T505-R001 wires change, save, and close events to Global evidence refresh.
    - id: T505-R002
      severity: Medium
      disposition: addressed
      summary: The per-snapshot file-size setting was also used as the aggregate snapshot budget.
      changes:
        - Separate maxSnapshotCompressedBytes and maxTotalCompressedBytes.
        - Keep deprecated maxCompressedBytes only for existing internal caller compatibility.
        - Resolve the user-facing setting only into the per-snapshot limit.
      tests:
        - T505-R002 keeps individually valid snapshots when only their combined size exceeds the per-snapshot limit.
        - Existing T601 count, aggregate cleanup, expiration, mapping, and corruption tests remain green.
    - id: T505-R003
      severity: Medium
      disposition: addressed
      summary: Global aggregation recompiled raw exclusion settings instead of using the PR side last-valid policy.
      changes:
        - Reuse the active ReviewFileExclusionPolicyService created by the base composition root.
        - Inject the shared service into NodeRepositoryFileEnumerator and T505 source.
        - Use the service revision as T504 configuration cache evidence.
        - Refresh Global UI on effective policy changes.
      tests:
        - T505-R003 reuses the shared last-valid exclusion policy after an invalid setting.
        - Existing shared PR/Global exclusion policy tests remain green.
    - id: T505-R004
      severity: Medium
      disposition: addressed
      summary: Invalid or unsafe snapshot setting values could throw during extension activation.
      changes:
        - Add Number.MAX_SAFE_INTEGER as the manifest maximum.
        - Treat setting input as unknown and fall back to the default for non-positive, non-integer, non-finite, or unsafe values.
        - Preserve the independent aggregate budget after fallback.
      tests:
        - T505-R004 invalid snapshot settings fall back without throwing and the manifest caps safe integers.
        - VS Code Extension Host lifecycle remains green.
