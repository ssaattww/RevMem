findings:
  - id: T506-REV-001
    severity: high
    status: open
    origin: review_of_acceptance_coverage_and_runtime_integration
    location: test/integration/t506-global-multi-context.integration.test.ts; src/t305-extension.ts; src/adapters/document-review-state/document-review-state-session-provider.ts
    description: T506 directly invokes the pure document-change mapper, while the production VS Code document-change path only refreshes Global Understanding and never maps/persists owner-wide Global ranges.
    impact: after an editor change, unchanged reviewed Global prefix/suffix ranges are not conservatively preserved; the file becomes stale/zero and can later be removed wholesale, so T506 change-following acceptance is not satisfied.
    evidence: current onDidChangeTextDocument requests only GlobalUnderstanding refresh; T505 source reads persisted state; calculator rejects changed content hash as stale; session provider removes stale file state; T506 test manually calls the mapper without repository commit.
    required_action: wire actual TextDocument changes through T502 mapping and atomic persistence/history, then add a Red Extension Host regression that edits a reviewed file and verifies mapped Global ranges plus same Global Understanding after restart.

