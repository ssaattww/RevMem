findings:
  - id: T505-R002
    severity: medium
    origin: introduced_by_change
    location: src/application/non-git-snapshots/index.ts; src/application/non-git-snapshots/non-git-snapshot-settings.ts; package.json
    description: Per-snapshot and aggregate fields are split, but no invariant prevents the aggregate budget from being lower than a valid per-snapshot limit; cleanup can delete the just-saved snapshot and saveLatest can publish a dangling pointer.
    impact: A configured-valid non-Git snapshot can report success and immediately become missing, losing review evidence; incomplete limit objects also compile.
    evidence: save checks only maxSnapshotCompressedBytes, puts the snapshot, cleanup deletes while total exceeds maxTotalCompressedBytes, and saveLatest sets latest afterward; resolver accepts per values above its fixed aggregate default.
    required_action: Add a Red self-eviction/latest-pointer test, enforce total >= per, require complete limit variants at type level, and guarantee the saved ID remains stored before success.
  - id: T505-R005
    severity: medium
    origin: introduced_by_fix
    location: src/t305-extension.ts; src/ui/global-understanding/global-understanding-ui-model.ts; src/ui/global-understanding/vscode-global-understanding-runtime.ts
    description: Every text change starts a recalculation, stale live snapshots intentionally throw, and stale-generation errors are rethrown and displayed as user errors.
    impact: Normal rapid typing can repeatedly show Global recalculation error notifications and create overlapping repository scans.
    evidence: validateCurrent rejects version/hash changes; refresh catch rethrows even when generation is stale; refreshWithErrorBoundary always reports rejection.
    required_action: Treat stale generation failure as cancellation, debounce/coalesce document changes, and retain reporting only for current-generation failures.
  - id: T505-R006
    severity: low
    origin: coverage_miss
    location: package.json; test/unit/t305-validation-wiring.test.ts
    description: The dedicated test:t505 command does not execute t505-review-findings.test.ts; the regressions run only transitively in the full unit suite.
    impact: Focused T505 validation can miss all four review-finding regressions.
    evidence: test:t505 starts only global-understanding-ui.test.js, which does not import t505-review-findings; t305-validation-wiring does.
    required_action: Include the review-finding suite directly in test:t505 and add a focused discovery contract.
  - id: T505-R007
    severity: low
    origin: introduced_by_fix
    location: handoffs/issue-1-t505-review-followup-20260806210039.yaml
    description: The file declares schema_version 3 but uses a custom nested handoff shape instead of the required chat-handoff-manager v3 packet and omits source_payloads.
    impact: A schema v3 reader cannot losslessly recover typed target identity, permissions, validation, reviewer state, and next action.
    evidence: Required top-level producer/repository/target/authorized_actions/write_boundary/commands/tests/ci/review/report/source_payloads/transport fields are absent.
    required_action: Regenerate using the ZIP v3 contract and preserve the original packet under source_payloads.

