      origin: introduced_by_change
      location: src/adapters/local-git/node-git-command-executor.ts timeout/termination path
      description: NodeGitCommandExecutor no longer guarantees a bounded timeout lifecycle.
      impact: A child that ignores/cannot receive termination and never closes can leave the Promise and activity status pending indefinitely.
