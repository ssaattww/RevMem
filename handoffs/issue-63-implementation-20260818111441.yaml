      severity: medium
      origin: introduced_by_change
      location: src/application/operation-feedback/operation-feedback.ts (reportedErrors/recordFailure)
      description: Process-lifetime Error de-duplication suppresses required terminal lifecycle events for nested and later operations.
      impact: An operation can emit START without its terminal ERROR; reusing one Error object can suppress later independent terminal events.
