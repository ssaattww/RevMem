tradeoffs:
  - PR raw-text and parsed evidence caches are Extension-Host-lifetime only and are not persisted across restart.
  - First activation of a very large PR context still incurs a deliberate full scan; immutable revision caching amortizes subsequent recalculations.
  - Ordinary candidate counting still traverses directory paths, but unopened file bodies are not read.

