requirements:
  ordinary_global:
    - Do not content-scan unopened ordinary repository files for Global line progress.
    - Keep opened/retained files as the Global line denominator.
    - Report opened and unopened candidate counts separately.
  pull_request:
    - Fully scan reviewable PR files even if they were never opened in an editor.
    - Existing/added/renamed/copied files use complete HEAD text.
    - Deleted files use complete BASE text.
    - Promote only files that exist at HEAD into Global as opened evidence.
    - Cache immutable full text and parsed Global evidence to avoid repeat reads/parsing.
  process:
    - Use RevMem TDD with Red evidence before implementation.
    - Use only exact-PR-HEAD workflow runs as CI evidence.
    - Preserve failure diagnostic artifacts.
    - Save repository report and concise PR comment.
    - Never merge; merge belongs to the user.

