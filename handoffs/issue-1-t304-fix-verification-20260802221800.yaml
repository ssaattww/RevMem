findings:
  - id: T304-R1-P1
    severity: high
    origin: introduced_by_change
    location: src/ui/pr-progress/pull-request-progress-tree-data-provider.ts createOpenTarget; added/deleted selection test; T302/T303 content path
    description: Added and deleted files fabricate nonexistent immutable sides by falling back to the path that exists only in the opposite revision.
    impact: Selecting added/deleted files cannot open the exact diff through the current T302/T303 text-content pipeline without ignoring the target contract.
    evidence: Local Git returns missing-file for absent commit/path; current test only asserts duplicated paths.
    required_action: Model absent sides or an immutable empty-document source and add an end-to-end added/deleted diff-open regression.
  - id: T304-R1-P2
    severity: high
    origin: coverage_miss
    location: T304 snapshot/reviewability contract and T301 progress calculator
    description: Encoding unsupported requires zero line counts while the documented T301 producer returns additions plus deletions for every nonexcluded nonbinary file.
    impact: Real changed encoding-unsupported files cannot be supplied without provider rejection or bypassing the authoritative calculator.
    evidence: T301 only zeroes excluded files; encoding reasons are not exclusion reasons; current test uses zero-change synthetic records.
    required_action: Integrate availability into the producer or define an authoritative projection and test nonzero changed encoding-unsupported files end to end.
  - id: T304-R2-P1
    severity: medium
    origin: coverage_miss
    location: src/ui/pr-progress/index.ts and type-fixtures/contracts/review-contracts.fixture.ts
    description: New T304 public exports are not fixed by the repository consumer type fixture.
    impact: Contract typecheck can succeed while T304 public API becomes incompatible or accepts invalid shapes.
    evidence: Design 13.2 requires consumer fixtures; no src/ui/pr-progress import exists in the fixture.
    required_action: Add positive and negative compile-time fixture coverage for T304 public contracts.

