      - environment and git context
  findings:
    - id: T505-R001
      severity: High
      disposition: addressed
      summary: Global understanding ignored unsaved VS Code buffers and lacked change/save/close refresh.
      changes:
        - T505 receives immutable open TextDocument snapshots with line count, non-empty indexes, SHA-256, version cache key, and validateCurrent.
        - Open-document denominator and source evidence replace the matching disk enumeration entry.
        - document change, save, and close events refresh Global understanding.
      tests:
        - Unsaved buffer differs from disk and remains current immediately after review-state persistence.
        - Save and close switches the same path back to disk evidence.
        - Production wiring contains change/save/close subscriptions.
    - id: T505-R002
      severity: Medium
      disposition: addressed
      summary: The per-snapshot file-size setting was also used as the aggregate snapshot budget.
      changes:
        - Added separate maxSnapshotCompressedBytes and maxTotalCompressedBytes limits.
        - The public setting changes only the per-snapshot limit; aggregate budget remains a separate fixed policy.
        - Legacy maxCompressedBytes remains accepted for existing internal callers.
      tests:
        - Multiple individually valid snapshots survive when combined bytes exceed only the per-snapshot limit.
    - id: T505-R003
      severity: Medium
      disposition: addressed
      summary: Global aggregation recompiled raw exclusion settings instead of using the PR side last-valid policy.
      changes:
        - T505 receives the same ReviewFileExclusionPolicyService created by the base extension.
        - Repository enumeration consumes the service evaluate/evaluateDirectory boundary.
        - T504 configurationKey uses the shared policy revision.
      tests:
        - A valid exclusion followed by an invalid setting retains identical Global denominator and pruned diagnostics.
    - id: T505-R004
      severity: Medium
      disposition: addressed
      summary: Invalid or unsafe snapshot setting values could throw during extension activation.
      changes:
        - Resolver accepts unknown runtime values and falls back to the manifest default.
        - Manifest caps the setting at Number.MAX_SAFE_INTEGER.
        - Invalid, non-integer, non-finite, and unsafe values do not throw.
      tests:
        - All invalid value classes resolve to defaults.
        - Manifest maximum is verified.
