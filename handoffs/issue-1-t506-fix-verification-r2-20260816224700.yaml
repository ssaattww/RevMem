    - id: T506-REV-002
      severity: high
      origin: introduced_by_fix
      source_severity_preserved: true
      status: partial_open
      production_fix_present: true
      evidence:
        - FileSystemReviewStateRepository now has module-shared outer write serialization by storage root.
        - JsonlReviewHistoryStore now has module-shared append serialization by history file path.
        - DocumentReviewEditRuntime supports stale CAS reload/replan.
        - current concurrency test uses one ControlledSharedRepository and one shared ReviewHistoryRecorder/store, bypassing both production multi-instance shared queues.
        - production t305-extension still creates a separate default edit-runtime persistence/history instance and therefore relies on the module-shared queues that the regression does not exercise.
      impact: a regression that accidentally restores instance-local state/history queues would not be detected by the current T506 concurrency test, so the original High concurrency defect lacks permanent production-boundary coverage.
      required_action:
        - add a deterministic regression using separate real FileSystemReviewStateRepository instances sharing one storage root and prove concurrent command/edit preserves both updates through stale/replan
        - add a deterministic regression using separate JsonlReviewHistoryStore/recorder instances sharing one history file and prove both events survive
        - alternatively inject the actual base extension persistence/history instances into production edit runtime and test that actual composition
        - re-run focused and full CI on the new current HEAD
