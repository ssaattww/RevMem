      "payload": "# Issue #126 / PR #155 通常レビュー・検証記録\n\n## 結論\n\n試験の途中で失敗しても、その試験が起動した子だけを回収し、終了と出力の完了後に一時領域を削除する。製品ロック、CI 設定、T607 は変更しない。通常レビューの必須指摘は解消済み。\n\n## 対象\n\n- [Issue #126](https://github.com/ssaattww/RevMem/issues/126) と [Draft PR #155](https://github.com/ssaattww/RevMem/pull/155)\n- 基準版 `1a25b982ae42490e9cb609108ac0372dad82d333`、初回通常レビュー `f89598168fbd7db2dc10297b85db0515e66fb17e`、診断追加の技術版 `fc08ec04a82719ac74a15c5e8bcea5e0f639b748`\n- 変更：`test/unit/t604-storage-lock-cleanup.test.ts` のみ。取得通知、競合の待機切れ確認、明示解放、解放後の取得を維持。\n- 初回必須指摘 `I126-NR-001` / Medium / coverage_miss：最初の子が取得前に終了すると、標準出力・標準エラー・シグナルが親側のエラーに出ない。親が待つ取得通知の失敗にも終了情報と出力を含め、同じ通常レビュー担当が解消を確認した。\n\n## 通常レビューの必須指摘と解消\n\n- 初回判定は `fail`、診断追加版の修正確認は `pass`（必須0件）。\n- 指摘箇所：初回技術版の `test/unit/t604-storage-lock-cleanup.test.ts` 119〜134行、463行。\n- 原因と影響：親は `first.ready` を待つため、最初の子が取得通知前に異常終了すると、そのエラーには終了番号しか残らなかった。後から生成される別のエラーは処理済みとなり、CI から子の出力誤りやシグナルを切り分けにくい。\n- 修正条件：取得通知前でも子の標準出力・標準エラー・終了番号・シグナルを親に残し、正常な競合の待機切れ判定を変えない。制御した先頭子の失敗で、子の回収後に一時領域が消えることも確認する。\n- 解消証拠：親の実プロセス比較は、旧版の終了23のみ、新版では出力2種・終了23を保持し、削除前に終了済み。通常レビュー担当は別にハンドラー5条件（終了0のエラー名、SIGTERM、終了23、正常解放、入力エラー）を模擬して5/5。取得時の競合の期待値と後続の取得は維持。\n\n## 検証\n\n| 対象と版 | 結果 |\n| --- | --- |\n| 現行 main、通常／200 ms 起動遅延 | どちらも成功。過去の同一CIで観測された順序依存は、現行版では再現せず。 |\n| 現行 main と初回修正版、2番目の子を意図的に終了23 | 現行は子1が生きたまま一時領域を削除。初回修正版は子1の終了後に削除し、子2の標準エラー・終了23を保持。 |\n| 初回修正版、Linux / Node.js 24.22.3 | 通常20、起動遅延20、通常・遅延の最大4並列60、合計100/100。T604・T605・T606 の重複を除いた29ファイル281/281。 |\n| 診断追加版、1番目の子を取得通知前に終了23 | 旧版は終了番号のみ、新版は標準出力・標準エラー・終了番号を親エラーに保持。子の終了後に一時領域を削除。 |\n| 診断追加版 | 型コンパイル、対象と強制終了後の再取得2/2、同一通常レビュー担当の終了ハンドラー5条件が成功。 |\n| 正式公開版CI | 初回 [46076585700](https://github.com/ssaattww/RevMem/actions/runs/46076585700)、診断追加 [46077405960](https://github.com/ssaattww/RevMem/actions/runs/46077405960) とも成功。 |\n\n診断追加の公開版は[自動CIジョブログ](https://github.com/ssaattww/RevMem/actions/runs/46077405960/job/140768251204)で T604・T605・T606 の各ステップから対象試験を計3回実行し、すべて成功した。公開版の3回を100回の反復とは区別する。初回版と追加版の配布物はそれぞれ成果物 ID 15235312182 と 1