findings:
  - id: PR68-R001
    severity: high
    origin: introduced_by_change
    location: "src/t405-pull-request-review-runtime.ts openSession/projectContextFileIdentities; src/core/pr-progress/pr-diff-progress.ts validateFileState"
    description: "A new mixed-case Windows PR-diff-first review persists raw-case fileId with lower-case currentPath; subsequent PR progress finds the raw key and rejects the path mismatch."
    impact: "PR review can persist a mark and then fail all subsequent PR Progress updates for that file."
    evidence: "Raw diff IDs preserve Git casing; fallback currentPath is lower-cased; mutation persists both; projection skips an existing raw key; core comparison is case-sensitive."
    required_action: "Unify persisted/calculation path identity and add a RED->Green mixed-case empty-state PR-diff-first progress regression."
  - id: PR68-R002
    severity: high
    origin: introduced_by_change
    location: "src/t505-global-understanding-source.ts; src/adapters/document-review-state/persisted-document-review-state-session-provider.ts; src/t405-pull-request-review-runtime.ts"
    description: "Pre-fix Windows PR state retains raw path casing; new evidence and normal-editor lookup use lower-case identity without a legacy compatibility/migration boundary, allowing missing Global state and duplicate file IDs."
    impact: "Existing users can remain missing after upgrade, split one logical file into two persisted identities, and later hit conflict failures or stale PR numerator."
    evidence: "Base PR diff sessions stored raw logicalPath; Global core uses exact currentPath; normal-editor selected PR provider uses exact lower-case lookup and creates a new hash when absent; runtime rejects multiple canonical IDs."
    required_action: "Define/read or migrate legacy Windows persisted identity and test an upgrade fixture through Global, normal editor, PR progress, and PR diff open."
  - id: PR68-R003
    severity: high
    origin: introduced_by_change
    location: "src/t405-pull-request-review-runtime.ts activateProgress; src/t305-extension.ts refreshPullRequestProgressForSelection; src/ui/pr-progress/vscode-pull-request-progress-tree.ts setPullRequestProgressSource"
    description: "Shared asynchronous PR Progress activation has no generation/current-context guard; stale success can overwrite the newer PR snapshot and stale failure can clear it."
    impact: "The dedicated view can display the wrong PR under the selected context or become empty after a successful newer refresh."
    evidence: "One shared provider, setSource refresh before new activation clears, no token before replace/clear, and Current Context generation ends before dependent refresh completion."
    required_action: "Bind activation publication to current generation/context and add deterministic A/B success/failure/leave-context race regressions."
  - id: PR68-R004
    severity: high
    origin: introduced_by_change
    location: "src/t305-extension.ts Current Context refreshDependents; src/ui/current-context/current-context-runtime-coordinator.ts"
    description: "PR Progress is awaited first without an isolated error boundary after the selected owner changes; its failure prevents decoration, Global, and Review Contexts refresh."
    impact: "UI/commands can target PR B while stale reviewed decorations from PR A remain visible, violating fail-closed certainty."
    evidence: "Coordinator applies setSelectedContext before dependents; first dependent await can throw; outer boundary only reports error and does not rerender new-context decorations."
    required_action: "Isolate PR projection failure or make context switching atomic so new-owner decorations and other dependents still become fail-closed; add rejection regression and separate live-edit mutation vs projection error reporting."

