findings:
  - id: T603-R001
    severity: high
    origin: introduced_by_change
    location:
      - src/adapters/state-repository/persistence-schema-recovery.ts validateContextDocument/validateGlobalDocument/validateManifestDocument
      - src/adapters/state-repository/validated-file-system-review-state-repository.ts load/prepareTarget
      - direct cache dependencies
    description: Preflight validates only a subset of current-schema persisted state and clears the uncertain flag before downstream load validation; a downstream failure leaves the prior cache available, so getCurrent can expose stale reviewed state after structural corruption.
    impact: Violates T603 and AC-24 by allowing uncertain persisted evidence to appear reviewed.
    evidence:
      - validateContextDocument does not validate context kind/descriptors/timestamps/deep file shape.
      - prepareTarget deletes uncertainty on ready before super.load completes.
      - low-level load failure does not clear a prior cache.
      - Focused test covers malformed JSON on first load, not structural corruption after a valid cached load.
    required_action: Fully canonical-validate before ready or mark target uncertain and hide/clear cache on every downstream validation/load failure; add valid-load then structural-corruption regression tests including duplicate/missing/deep-field cases.
  - id: T603-R002
    severity: high
    origin: introduced_by_change
    location:
      - src/adapters/state-repository/persistence-schema-recovery.ts v0-to-v1 steps
      - src/adapters/state-repository/jsonl-review-history-store.ts HISTORY_MIGRATION_STEPS
      - src/adapters/non-git-snapshots/node-non-git-snapshot-adapters.ts SNAPSHOT_MIGRATION_STEPS
    description: Historical v0-to-v1 steps declare toVersion 1 but emit REVIEW_RANGE_SCHEMA_VERSION, so when current becomes 2 the v0-to-v1 step emits 2 and fails the chain target-version check before a 1-to-2 step can run.
    impact: The adjacent migration-chain foundation fails at the first future schema bump for state, history and snapshots.
    evidence:
      - runSchemaMigrationChain requires current.schemaVersion to equal step.toVersion.
      - All production v0-to-v1 steps write the global current constant.
    required_action: Make each migration step emit its immutable target version and add multi-step regression coverage for state/history/snapshot.
  - id: T603-R003
    severity: medium
    origin: introduced_by_change
    location:
      - src/adapters/state-repository/persistence-schema-recovery.ts MANIFEST_STEPS and repository prepare branch
      - src/adapters/state-repository/contracts.ts RepositoryStateManifestContextReference
    description: Manifest migration marks every context reference as v1 while repository preparation migrates only the selected context document, or no context when the target is absent.
    impact: Persisted manifest reference metadata can claim v1 for an untouched v0 immutable document, violating the existing reference contract.
    evidence:
      - MANIFEST_STEPS maps schemaVersion over all references.
      - preparePersistedReviewState only reads targetReference before publishing the migrated manifest.
      - No repository-style multi-context T603 fixture exists.
    required_action: Migrate/validate every referenced context before publishing the current manifest or represent mixed versions truthfully; add multi-context and target-absent tests asserting reference/document version equality.
  - id: T603-R004
    severity: medium
    origin: introduced_by_change
    location:
      - src/adapters/state-repository/persistence-schema-recovery.ts migrateContextV0ToV1/WORKSPACE_STEPS/MANIFEST_STEPS
    description: Parent v0 migration blindly overwrites nested schemaVersion fields with current v1, including a nested future schema such as v2.
    impact: Newer/unsupported nested persisted data can be silently downgraded and reinterpreted as v1 instead of being preserved and rejected.
    evidence:
      - Nested file/context/global/reference schemaVersion values are assigned directly without their own migration/version validation.
    required_action: Validate and migrate nested persisted models individually; reject future nested versions unchanged and add root-v0 plus nested-v2 tests.
  - id: T603-R005
    severity: medium
    origin: introduced_by_change
    location:
      - src/adapters/state-repository/persistence-schema-recovery.ts runSchemaMigrationChain/decodeOrQuarantine
      - src/adapters/state-repository/jsonl-review-history-store.ts
      - src/adapters/non-git-snapshots/node-non-git-snapshot-adapters.ts parseMigratedRecord
    description: Invalid schema metadata such as string, negative or non-integer is thrown as UnsupportedPersistedSchemaVersionError and therefore bypasses quarantine; snapshot null is also treated as missing legacy schema through nullish fallback.
    impact: Corrupt metadata repeatedly blocks operations instead of being isolated, while explicit null snapshot metadata can be silently accepted and rewritten.
    evidence:
      - UnsupportedPersistedSchemaVersionError covers both invalid values and valid future versions.
      - Recovery handlers preserve/rethrow that class.
      - Snapshot absentSchemaVersion fallback uses nullish behavior.
    required_action: Distinguish invalid/corrupt schema metadata from valid future integers; only undefined may use the explicit legacy fallback; add state/history/snapshot malformed-schema tests.
  - id: T603-R006
    severity: medium
    origin: introduced_by_change
    location:
      - src/adapters/non-git-snapshots/node-non-git-snapshot-adapters.ts get
      - src/application/non-git-snapshots/index.ts NonGitSnapshotTracker.read
    description: Wrapper corruption is quarantined, but compressed payload/hash/envelope corruption detected later by the tracker only returns corrupt and leaves the active persisted snapshot file in place.
    impact: Snapshot data corruption remains repeatedly selectable through active storage, so snapshot corruption isolation/recovery is incomplete.
    evidence:
      - Storage validates createdAt and bytes string, then decodes base64.
      - Tracker detects decompression/hash/envelope failure but does not quarantine/delete the storage entry.
      - Focused test only covers malformed wrapper JSON.
    required_action: Add an integrity/quarantine boundary for damaged payload/hash/envelope and handle latest-pointer consistency conservatively; add valid-wrapper damaged-payload regression tests.
  - id: T603-R007
    severity: medium
    origin: introduced_by_change
    location:
      - reports/issue-1-t603-implementation-20260816145900.md
      - handoffs/issue-1-t603-implementation-20260816150000.yaml
      - PR #53 body and implementation completion comment
    description: Durable implementation evidence contains multiple job/artifact/commit identities and lifecycle wording that do not match authoritative GitHub data.
    impact: A later worker can follow nonexistent or wrong evidence and violate exact-head CI/reviewer-continuity rules.
    evidence:
      - Red run 31929190714 actual job 95121366762 and artifact 9258779700; recorded job 95120961967 is 404 and artifact is recorded as 5717201218.
      - Run 31929450198 actual artifact 9258848153 vs recorded 5717346948.
      - Run 31929675591 actual job 95122502746/artifact 9258909583 vs recorded 95122672378/5717460644.
      - Run 31929798612 actual job 95122794408 vs report 95123012762.
      - Run 31929935759 actual job 95123109494 vs report/PR 95123412884.
      - Handoff records implementation commits 8e5851... and 9dda6c..., while PR commits are 5fa3b0c2c86f335851fb0b4dd29c0364c5a6133a and c77e375cab5e17787d7c8e36ca5b869982276f87.
      - Actual Red commit message is test: define T603 migration recovery behavior, not the report wording.
      - PR says independent review next, while handoff requires a normal review and no independent-final report path is reserved.
      - Current reviewed-head run 31930532442/job 95124484220 is recorded correctly.
    required_action: Correct implementation report/handoff/PR evidence from authoritative GitHub values, align lifecycle wording, and after behavior fixes record only the new implementation HEAD and its matching run as final evidence.

