findings:
  - id: T304-R1-P1
    severity: high
    status: open
    origin: introduced_by_change
    location:
      - src/ui/pr-progress/pull-request-progress-tree-data-provider.ts
      - src/core/pr-progress/pr-diff-progress.ts
      - src/ui/diff-editor/review-diff-editor-controller.ts
    description: File selection passes only PullRequestDiffFileProgress, which lacks context ID, base/head immutable revisions, filesystem semantics, and snapshot identity; stale or foreign nodes cannot be rejected.
    impact: The host may combine an old file record with a mutable current context and open a different PR context or revision than the node represents.
    required_action: Carry an immutable identity-bound open target or equivalent resolver token and reject stale/foreign nodes; add two-context, head-update, stale-node, and rename/add/delete tests.
  - id: T304-R1-P2
    severity: high
    status: open
    origin: coverage_miss
    location:
      - src/ui/pr-progress/pull-request-progress-tree-data-provider.ts
      - src/core/pr-progress/pr-diff-progress.ts
      - reports/issue-1-t304-implementation-20260802210612.md
    description: The design requires encoding-unsupported files in the line-review-unsupported category with a reason, but the current contract supports only binary/default-glob/user-glob reasons.
    impact: Required invalid-encoding or decoder-unsupported files cannot be represented or displayed, and T304's public contract would need a breaking follow-up change.
    required_action: Define a line-review-unavailability contract for binary and encoding/decoder unsupported cases, require a reason, and add focused tests; otherwise update the authoritative design and task before deferring.
  - id: T304-R1-P3
    severity: medium
    status: open
    origin: introduced_by_change
    location:
      - package.json
      - .github/workflows/ci.yml
      - test/unit/pull-request-progress-tree.test.ts
    description: The T304 test is executed only by a raw workflow command; test:unit, npm test, and a focused test:t304 package script omit it.
    impact: Standard local and reusable validation can pass while T304 regressions remain undetected, and a workflow edit can silently remove the only execution path.
    required_action: Register the suite in test:unit, add test:t304, invoke it from CI, and add a discovery contract test.

