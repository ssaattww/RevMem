    location: "src/t405-review-contexts-runtime.ts T405ReviewContextsSource.load/readSynchronizedRepository"
    description: "PR-context progress still advances only after all persisted PR contexts in one repository finish remote synchronization."
    impact: "If a later PR remote acquisition stalls, progress remains 0 instead of reflecting earlier completed contexts, leaving the long-running operation diagnostically opaque."
    evidence: "load awaits readSynchronizedRepository before reportPullRequestContext; readSynchronizedRepository loops remote fetchCurrent calls and only returns the full projected array afterwards."
    required_action: "Report each PR-context completion at the per-context acquisition boundary and add a composed two-context fixture that holds the second PR pending while observing completed=1."
  - id: PR85-NR-003
    severity: medium
    origin: coverage_miss
    location: "src/t405-pull-request-review-runtime.ts getProgress + Review Contexts production composition"
    description: "Review Contexts still owns pull-request-files start/end progress emitted by getProgress."
    impact: "Output/Status can show PR-file progress under Review Contexts rather than the owning PR Progress lifecycle, violating operation ownership and misleading diagnostics."
    evidence: "progressFor forwards the Review Contexts feedbackContext; t305-extension maps the port to runtime.getProgress; getProgress emits pull-request-files with that supplied context."
    required_action: "Separate Review Context internal progress calculation from PR Progress lifecycle reporting and add an actual composition test proving Review Contexts never labels pull-request-files progress while selected PR Progress does."

