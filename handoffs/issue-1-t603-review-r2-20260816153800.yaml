findings: &findings
  - id: T603-R001
    severity: high
    origin: introduced_by_change
    location: "persistence-schema-recovery.ts validation; validated-file-system-review-state-repository.ts uncertainty/load; coherent and low-level repository caches"
    description: Preflight incompletely validates current-schema persisted state and clears target uncertainty before downstream load validation; downstream failures leave prior caches intact. Manifest/global uncertainty is owner-wide but uncertainTargets is context-local, allowing sibling cached targets to expose stale owner Global evidence.
    impact: Uncertain or corrupt persistence can still appear reviewed, directly violating T603 and AC-24.
    evidence: Preflight omits context kind/descriptors/timestamps/deep file/range validation; low-level load failures do not clear cache; coherent repository overlays cached owner Global by storage root; current tests only cover malformed JSON on first load.
    required_action: Fully canonical-validate before ready, retain/propagate uncertainty on downstream failure, make manifest/global uncertainty owner-wide, hide/clear stale caches, and add cached-load structural/deep/owner-sibling regression tests.
  - id: T603-R002
    severity: high
    origin: introduced_by_change
    location: "All v0->v1 migration steps in persistence-schema-recovery.ts, jsonl-review-history-store.ts and node-non-git-snapshot-adapters.ts"
    description: Historical steps declare toVersion 1 but emit REVIEW_RANGE_SCHEMA_VERSION, so a future current schema 2 makes the old 0->1 step emit 2 and fail its own target-version assertion.
    impact: The adjacent migration chain fails at the first future schema bump for state, history and snapshot data.
    evidence: runSchemaMigrationChain requires migrated schemaVersion to equal step.toVersion; every production v0->v1 step writes the global current constant.
    required_action: Make historical steps emit immutable target version 1 and add multi-step migration coverage.
  - id: T603-R003
    severity: medium
    origin: introduced_by_change
    location: "MANIFEST_STEPS and repository prepare branch; RepositoryStateManifestContextReference contract"
    description: Manifest migration marks every context reference as current v1 while only the selected context document is migrated, or none when the target is absent.
    impact: Manifest metadata can claim v1 for untouched v0 immutable context documents.
    evidence: MANIFEST_STEPS maps schemaVersion across every reference; preparePersistedReviewState reads only targetReference before publishing the manifest.
    required_action: Migrate/validate all referenced contexts before publishing current manifest or represent mixed versions truthfully; add multi-context/target-absent fixtures.
  - id: T603-R004
    severity: medium
    origin: introduced_by_change
    location: "migrateContextV0ToV1, WORKSPACE_STEPS and MANIFEST_STEPS"
    description: Parent v0 migration blindly overwrites nested schemaVersion fields with v1, including a nested future schema such as v2.
    impact: Newer/unsupported nested persisted data can be silently downgraded and reinterpreted.
    evidence: Nested file/context/global/reference versions are assigned directly without individual source-version validation/migration.
    required_action: Validate/migrate nested models individually and preserve/reject future nested versions; add root-v0+nested-v2 tests.
  - id: T603-R005
    severity: medium
    origin: introduced_by_change
    location: "runSchemaMigrationChain/decodeOrQuarantine and snapshot parseMigratedRecord"
    description: Invalid schema metadata (string, negative, non-integer) uses the same Unsupported error as a valid future version and therefore bypasses quarantine; snapshot null is treated as missing legacy schema through nullish fallback.
    impact: Corrupt metadata repeatedly blocks recovery, while explicit null can be silently rewritten as legacy.
    evidence: Invalid rawVersion values throw UnsupportedPersistedSchemaVersionError; recovery rethrows that class; snapshot passes absentSchemaVersion 0 via nullish selection.
    required_action: Distinguish corrupt metadata from valid future integer versions, quarantine invalid values, and allow legacy fallback only for undefined.
  - id: T603-R006
    severity: medium
    origin: introduced_by_change
    location: "NodeNonGitSnapshotStorage.get and NonGitSnapshotTracker.read"
    description: Wrapper corruption is quarantined, but gzip/hash/inner-envelope corruption detected by the tracker only returns corrupt and leaves the active persisted entry in place.
    impact: Corrupt snapshot payloads remain repeatedly selectable through the authoritative latest pointer.
    evidence: Storage validates wrapper fields then returns bytes; tracker detects decompression/hash/envelope failure without delete/quarantine; focused test covers malformed wrapper JSON only.
    required_action: Connect payload integrity failure to quarantine/delete and conservatively handle the latest pointer; add damaged payload/hash/envelope tests.
  - id: T603-R007
    severity: medium
    origin: introduced_by_change
    location: "T603 implementation report/handoff and PR body/completion comment"
    description: Durable implementation evidence records multiple job/artifact/commit identities and lifecycle wording that do not match authoritative GitHub data.
    impact: Later workers can follow nonexistent/wrong evidence and violate exact-head/reviewer-continuity rules.
    evidence: Actual Red job/artifact are 95121366762/9258779700, not 95120961967/5717201218; additional run/job/artifact and commit SHA mismatches are enumerated in the R2 report; reviewed-head run 31930532442/job95124484220 is correct.
    required_action: Correct implementation report/handoff/PR evidence from GitHub authoritative values and align normal-review/finding-closure/independent-final lifecycle wording.
  - id: T603-R008
    severity: medium
    origin: introduced_by_change
    location: "jsonl-review-history-store.ts, changed history test, design rev4 §15.4, Design/BreakingChanges.md"
    description: PR changes corrupt-history behavior from reject-without-append to quarantine/salvage/append success, contradicting accepted design; the observable behavior break is not recorded in BreakingChanges.
    impact: Audit failure semantics are ambiguous between task/design/implementation and consumer expectations.
    evidence: Design explicitly says corrupt existing JSONL must reject without subsequent append; the PR rewrites the prior rejection test to successful append; BreakingChanges has no T603 entry.
    required_action: Obtain owner/user decision; either restore design-conformant reject behavior or update accepted design and BreakingChanges for salvage+append, then test that contract.
  - id: T603-R009
    severity: high
    origin: introduced_by_change
    location: "resolveReferencedFile and repository child-validation quarantine paths"
    description: A corrupt manifest reference can resolve outside its declared subtree while remaining under storage root, or point one context to another valid context file; validation failure then quarantines/removes the valid child rather than the corrupt manifest/reference.
    impact: One corrupt manifest can destroy valid sibling-context or Global evidence; cross-type references can also be misinterpreted under shallow validation.
    evidence: Prefix check occurs before path.resolve and only root containment is checked afterward; context/global validation failures call quarantinePersistedText on the referenced child with removeOriginal=true.
    required_action: Enforce canonical post-resolve subtree containment, classify reference mismatch as manifest corruption, preserve valid child data, and add sibling/cross-subtree preservation tests.
  - id: T603-R010
    severity: medium
    origin: introduced_by_change
    location: "extension.ts production composition and lazy state/history/snapshot migration entrypoints"
    description: Accepted design requires staged migration at startup, but production only constructs adapters; migration occurs on later target access/append/get. Historical monthly JSONL files have no startup sweep and may remain legacy indefinitely.
    impact: Saved models can remain mixed-version instead of being migrated at startup, prolonging metadata inconsistency and leaving old history untouched.
    evidence: activate constructs repositories/history/snapshot tracker; state migration is in load/save/commit, history migration only in append for that month, snapshot migration only in get/getLatest/entries.
    required_action: Add a startup storage migration/sweep or explicitly change accepted design to lazy migration; add restart/startup integration coverage over history/repository contexts/snapshot entries+pointers.
  - id: T603-R011
    severity: medium
    origin: coverage_miss
    location: "package.json, .github/workflows/ci.yml, test/unit/review-history-jsonl-store.test.ts"
    description: The PR-modified review-history-jsonl-store test is not executed by current CI: test:unit excludes it, CI does not run test:t206, and T603 focused CI runs only the T603 file.
    impact: The corrupt-only prepared.migrated=false path changed by the PR can regress without CI failure.
    evidence: package scripts and workflow were inspected directly; tsconfig.test compiles all tests but execution lists omit this test.
    required_action: Wire the test into default/focused CI and add a workflow contract assertion for T603/history coverage.
  - id: T603-R012
    severity: medium
    origin: coverage_miss
    location: "test-only Red commit 3c88a86... and later repository/snapshot implementation"
    description: The six pre-implementation Red fixtures do not specify repository-style manifest/global/context migration, target-absent/multi-document publication, or latest-pointer migration/quarantine although those behaviors were later implemented.
    impact: Significant T603 behavior lacks the project-required test-first Red evidence and contains several of the uncovered defects found in R003/R009/R010.
    evidence: The entire Red test file was inspected; only workspace state, workspace rollback, malformed workspace JSON, mixed JSONL, snapshot entry migration and snapshot wrapper corruption are covered.
    required_action: Add missing regression tests before behavior fixes, confirm Red on an exact head, then implement and re-run exact-head Green.
  - id: T603-R013
    severity: medium
    origin: introduced_by_change
    location: "prepareExistingHistory and JsonlReviewHistoryStore.append"
    description: Salvage validates each line only as a canonical event; it does not verify existing repositoryId/contextId against storage target, occurredAt month against the filename, or eventId uniqueness across retained/new records.
    impact: Recovery can republish wrong-owner, wrong-month, or duplicate-ID events as supposedly certain audit evidence.
    evidence: Existing-line loop calls migration+serializeReviewHistoryEvent only; target identity is checked only for the newly appended event; design requires monthly routing and globally unique opaque event IDs.
    required_action: Add file-level target/month/eventId integrity checks and wrong-owner/wrong-context/wrong-month/duplicate-ID recovery fixtures.
  - id: T603-R014
    severity: low
    origin: introduced_by_change
    location: "quarantinePersistedText"
    description: Quarantine writes through injected AtomicTextFileStore but removes the original with direct node:fs rm, bypassing the persistence abstraction.
    impact: Custom/deterministic stores can retain the active corrupt original even after the helper claims quarantine, and future alternate persistence adapters are unsafe.
    evidence: AtomicTextFileStore exposes read/write only; quarantinePersistedText calls store.writeTextAtomically then rm(filePath) directly.
    required_action: Add deletion to the persistence abstraction or make quarantine explicitly Node-filesystem-only, with a custom-store regression test.

