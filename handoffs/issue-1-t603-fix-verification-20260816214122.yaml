findings:
  - id: T603-R006
    severity: medium
    origin: introduced_by_change
    location: src/adapters/non-git-snapshots/node-non-git-snapshot-adapters.ts get/quarantine; src/application/non-git-snapshots/index.ts NonGitSnapshotTracker.read
    description: Snapshot wrapper or invalid-base64 corruption is quarantined inside storage.get and returned as undefined, so the tracker classifies it missing and never invokes storage.quarantine to invalidate valid latest pointers that still name the removed snapshot.
    impact: The authoritative latest pointer remains active/dangling after wrapper-level corruption, so snapshot corruption isolation/recovery and latest-pointer consistency are incomplete.
    evidence: Current R006 tests cover gzip/hash/envelope + latest invalidation, not malformed wrapper/invalid base64 + latest; startup metadata migration similarly does not validate pointer target existence after entry quarantine.
    required_action: Invalidate/quarantine every latest pointer naming a wrapper/base64-corrupt snapshot for both direct reads and startup migration; add valid-latest plus malformed-wrapper/invalid-base64 regressions.
  - id: T603-R013
    severity: medium
    origin: introduced_by_change
    location: src/adapters/state-repository/jsonl-review-history-store.ts prepareExistingHistory/append/migratePersistedReviewHistoryFile; src/adapters/persistence-startup-migration.ts migrateHistoryRoot
    description: Existing-line duplicate IDs are checked, but a new event ID is never compared with IDs already in the valid active history. Startup history migration also lacks the expected repository owner, so an internally consistent wrong-owner history can be migrated/published under another repository root.
    impact: History event uniqueness and startup owner integrity remain incomplete under the owner-selected reset policy.
    evidence: Owner-decision tests cover wrong owner/month/duplicate existing lines at append time but not existing-vs-new eventId collision or startup wrong-owner. Same-repository multiple contexts are valid and are not part of the remaining defect.
