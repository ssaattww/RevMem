    severity: medium
    origin: introduced_by_fix
    location: src/adapters/state-repository/validated-file-system-review-state-repository.ts load/loadGlobal/prepareTarget/markUncertain and coherent repository load/getCurrent
    description: Owner-wide uncertainStorageRoots is set after downstream validation failure but is only cleared by save/commit/create. A later successful read preparation does not clear it, and coherent load calls the overridden getCurrent, which returns undefined while the root flag remains set.
