findings:
  - id: PR85-NR-001
    severity: high
    blocking: true
    origin: requirement_design_fail_closed
    location: "src/t305-projection-refresh.ts::refreshCurrentContextDependents"
    description: "After refreshReviewContexts throws, the function stores the error but still unconditionally launches refreshPullRequestProgress."
    impact: "PR Progress can calculate against a missing/stale runtime and recreate empty/misleading state or secondary errors after the prerequisite registration failed."
    evidence:
      - "rev7 16.3.1 requires failure to return at the operation boundary and forbids progress inference when target snapshot registration fails."
      - "New tests assert only successful ordering and do not assert skip-on-registration-failure."
    required_action:
      - "Do not invoke selected PR Progress when Review Contexts acquisition/registration fails."
      - "Keep intended decoration/Global failure isolation independently."
      - "Add a regression asserting refreshPullRequestProgress is not called on Review Contexts failure."
    status: open

  - id: PR85-NR-002
    severity: high
    blocking: true
    origin: issue84_diagnostics_design
    location: "src/ui/review-contexts/vscode-review-contexts-runtime.ts::ReviewContextsTreeProvider.refresh"
    description: "Repository and PR-context counts are emitted only after source.load and publishLoaded have completed, as final completed=total observations."
    impact: "The expensive Review Contexts acquisition remains generic START-only while it is actually running; a stall/failure still gives no repository/context-stage progress, leaving Issue #84's long-operation diagnosis unresolved."
    evidence:
      - "rev7 16.7/16.10 requires count-only progress during long operations and PROGRESS when stage/count advances; completed=0 is valid."
      - "The Issue #84 regression test only checks stage strings/API existence and does not observe progress before acquisition completion."
    required_action:
      - "Emit repository/PR-context progress from actual acquisition/enumeration boundaries as work advances, before source.load returns."
      - "Use only allowlisted anonymous counts and include zero/unknown-total observations when meaningful."
      - "Add a blocked-acquisition behavior test that observes progress before completion."
    status: open

  - id: PR85-NR-003
    severity: medium
    blocking: false
    origin: concurrency_diagnostic_ownership
    location: "src/t405-pull-request-review-runtime.ts and src/application/operation-feedback/operation-feedback.ts"
    description: "PR-file progress is reported without an explicit OperationFeedbackContext even though no-context reporting is assigned to the most recently started active operation. The base read callback already supplies the PR feedback context, but the wrapper drops it."
    impact: "When PR Progress overlaps later Global/other operations, pull-request-files progress may be logged under the wrong label; unrelated reads of the same snapshot can also advance the shared PR-file count."
    evidence:
      - "OperationFeedback.reportProgress(context undefined) uses active.at(-1)."
      - "refreshCurrentContextDependents starts PR Progress before later decoration/Global work, allowing overlapping lifecycles."
      - "registration.readTextContent wrapper uses args[0] but does not forward args[1] feedbackContext to reportActiveOperationProgress."
    required_action:
      - "Bind every PR-file progress event to the PR Progress operation context."
      - "Prevent unrelated Global reads from advancing the PR Progress counter."
      - "Add an overlapping-operation regression asserting correct Output label/count ownership."
    status: open

