findings:
  - id: T506-REV-001
    severity: high
    origin: coverage_miss
    location: src/document-review-edit-runtime.ts:120-124; src/t305-extension.ts; non-Git workspace live-edit path
    description: Git live-edit path is fixed, but non-Git workspace returns unsupported-owner and never maps/persists live Context/Global edits.
    impact: T506 live edit/change-following and Global Understanding/restart behavior remains incomplete for a designed workspace context.
    evidence: task/design/README include workspace/live-edit semantics; runtime explicitly returns unsupported-owner for non-repository inspection; current EH regression creates a Git repository only.
    required_action: wire non-Git workspace live edits through snapshot-authoritative mapping/persistence and add real EH edit/restart regression.
  - id: T506-REV-002
    severity: high
    origin: introduced_by_fix
    location: src/document-review-edit-runtime.ts:89-94; src/t305-extension.ts; state/history persistence adapters
    description: fix creates independent state repository and history store instances, bypassing base runtime's instance-local storage-owner serialization.
    impact: concurrent live edit mapping and command/state transition can both accept the same old snapshot and last-writer-win the manifest; history read-modify-replace can lose an event.
    evidence: base and edit runtime instantiate separate repository/history objects; state write tails and history tails are instance fields; cross-process T604 does not cover this same-Extension-Host instance race.
    required_action: share one serialized repository/history boundary or shared owner mutex and add concurrent edit+command state/history regression.

