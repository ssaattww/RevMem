findings:
  - id: T603-R013
    severity: medium
    origin: introduced_by_change
    location: src/adapters/persistence-startup-migration.ts migrateRepositoryStateRoot/runPersistenceStartupMigration and src/adapters/state-repository/persistence-schema-recovery.ts preparePersistedReviewState
    description: Startup discovers and hash-validates the repositoryId from the manifest, but returns that owner to history migration only when a synthetic selected context is ready. A valid owner root whose selected context is absent therefore loses a known owner before history scanning.
    impact: Internally consistent history belonging to a different repository can escape startup quarantine/reset in an owner-validated root when state preparation returns absent.
    evidence: migrateRepositoryStateRoot returns preparation === "ready" ? repositoryId : undefined, while preparePersistedReviewState validates the owner/global/all references then returns absent when no selected target context exists. Current integration fixtures use a saved matching context and do not cover this sibling.
    required_action: Retain the hash/manifest-validated repository owner independently of selected-context ready/absent state and add a test-first valid-manifest+valid-Global+absent/empty-contexts+wrong-owner-history regression; continue permitting same-repository multi-context history.
  - id: T603-R015
    severity: medium
    origin: introduced_by_fix
    location: src/adapters/state-repository/validated-file-system-review-state-repository.ts prepareTarget/load/getCurrent and coherent repository load/cache behavior
    description: Recovery now clears uncertainStorageRoots inside prepareTarget immediately after preflight succeeds, before super.load refreshes the cached state. A concurrent getCurrent in that interval can observe the old cached commit.
    impact: The recovery path can briefly re-expose stale reviewed evidence that R001 deliberately hid, even though the sequential sticky-recovery regression is green.
    evidence: prepareTarget deletes the root guard on ready/absent; load awaits prepareTarget and only afterward awaits super.load. Existing test is sequential and does not gate the interval between those operations.
    required_action: Keep the external uncertainty guard until the new persisted snapshot is loaded into cache and downstream validation succeeds, while providing an internal load path that does not deadlock on the override; add a gated concurrent getCurrent regression and sibling-owner coverage.
  - id: T603-R016
    severity: medium
    origin: introduced_by_fix
    location: handoffs/issue-1-t603-fix-followup-r3-20260816230716.yaml and reports/issue-1-t603-fix-followup-r3-20260816230518.md
    description: The claimed replacement schema-v3 handoff is malformed and incomplete: invalid files.changed entry shapes, misplaced files.forbidden, repeated scope/non_goals/files blocks and anchors, and termination at line 1344 in the middle of write_boundary.allowed before commands/tests/ci/implementation/review/report/findings/source_payloads/next_action/transport.
    impact: The next worker cannot safely reconstruct target/CI/finding continuity/permissions/diagnostics from the handoff, defeating the required lossless transport boundary. The implementation report also inaccurately claims literal schema-v3 compliance.
    evidence: Direct file inspection at current HEAD shows repeated &id001/&id002/&id003 blocks and the final lines stop within write_boundary.allowed. Uploaded chat-handoff-manager requires one typed projection and complete producing core Skill outputs under source_payloads.
    required_action: Regenerate one strict schema-v3 packet with unique top-level keys, valid typed shapes and complete source_payloads; validate duplicate keys/anchors and the schema before commit, record that validation in the report, and separately record the post-handoff administrative HEAD exact CI in PR evidence.

