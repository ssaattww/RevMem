findings:
  - id: T505-R001
    severity: high
    origin: introduced_by_change
    location: src/extension.ts; src/t305-extension.ts; src/t505-global-understanding-source.ts; src/adapters/repository-files/node-global-understanding-file-source.ts
    description: Review commands persist live unsaved editor evidence, but immediate Global recalculation reads disk-only evidence.
    impact: The just-reviewed Global state becomes stale or the entire Tree/Status is cleared until another refresh trigger.
    evidence: Live editor hash/line count is persisted and reviewStateChanged fires; T505 source uses only filesystem enumerator and readFile-based source; no unsaved-buffer test exists.
    required_action: Add Red coverage and inject immutable open-document content/denominator evidence ahead of disk fallback, with save/close invalidation.
  - id: T505-R002
    severity: medium
    origin: introduced_by_change
    location: package.json; src/application/non-git-snapshots/non-git-snapshot-settings.ts; src/application/non-git-snapshots/index.ts
    description: The declared per-snapshot file-size setting is mapped to a field also used as the aggregate snapshot storage budget.
    impact: Multiple individually valid snapshots can evict unrelated history when their combined compressed size exceeds the per-file setting.
    evidence: Manifest says one snapshot; resolver maps to maxCompressedBytes; tracker uses it in both save reject and totalBytes cleanup.
    required_action: Split per-snapshot and aggregate byte limits and add multi-snapshot regression coverage.
  - id: T505-R003
    severity: medium
    origin: introduced_by_change
    location: src/t305-extension.ts; src/t505-global-understanding-source.ts; shared exclusion policy service/controller
    description: Global recalculation recompiles raw VS Code exclusion settings instead of reusing the shared accepted effective policy.
    impact: Invalid settings leave PR progress on the last valid policy but clear/fail Global Understanding, violating policy consistency.
    evidence: Base controller preserves last valid service state; T505 independently constructs ReviewFileExclusionPolicy from raw settings.
    required_action: Inject the shared canonical policy snapshot/revision and add invalid-after-valid consistency coverage.
  - id: T505-R004
    severity: medium
    origin: introduced_by_change
    location: package.json; src/application/non-git-snapshots/non-git-snapshot-settings.ts; src/extension.ts
    description: Invalid snapshot limit values throw synchronously during tracker construction without an activation error boundary.
    impact: One bad setting disables the entire extension rather than only the non-Git snapshot feature.
    evidence: Resolver rejects invalid values; activation calls it directly; manifest lacks a safe-integer maximum; test expects the throw.
    required_action: Add activation Red coverage, runtime validation/fallback, manifest maximum, and scoped error handling.

