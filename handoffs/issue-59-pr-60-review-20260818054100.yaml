findings:
  - id: R60-001
    severity: high
    blocking: true
    origin: introduced_by_change
    locations:
      - "src/t505-global-understanding-source.ts: recalculate(), capturePullRequestHeadFiles()"
      - "src/t405-pull-request-review-runtime.ts: readGlobalHeadFiles()"
    description: >-
      The immutable PR HEAD full-scan is gated by candidatePaths produced by walking the mutable working tree. T405 skips a HEAD-side PR file when candidatePaths does not contain file.newPath; T505 repeats the same candidate gate and later filters retained evidence by that mutable set. Current PR selection only proves PR headSha equals local Git HEAD and does not require a clean worktree.
    impact: >-
      If local HEAD equals the PR HEAD but a PR HEAD file is unstaged-deleted or renamed in the worktree, the file is silently omitted from the PR full scan and Global opened evidence even though the exact commit blob is available. Global file/line progress therefore depends on dirty-worktree presence rather than the accepted immutable PR revision.
    evidence:
      - "T505 recalculate() builds candidatePaths from NodeRepositoryFilePathEnumerator(owner.repositoryRoot)."
      - "T405 readGlobalHeadFiles(): if (!candidatePaths.has(file.newPath)) continue."
      - "T505 capturePullRequestHeadFiles(): if (!candidatePaths.has(canonicalPath)) continue."
      - "T505 openedByPath filters retained evidence through candidatePaths."
      - "findCurrentPullRequestContext() matches persisted open PR headSha to local headRevision but has no clean-worktree predicate."
      - "T405 and T505 PR tests always provide candidate sets containing the PR HEAD files and do not cover a dirty-worktree omission."
    required_action: >-
      Derive the active-PR reviewable HEAD-side file universe from the validated immutable PR snapshot plus exclusion policy rather than mutable path existence; prevent T505 from discarding immutable PR evidence solely because the working-tree walk omitted it. Add a Red/Green regression with a PR HEAD file absent from candidatePaths and verify exact HEAD read, promotion, and counting.

  - id: R60-002
    severity: medium
    blocking: true
    origin: requirement_design_divergence
    locations:
      - "doc/design/vscode-review-range-tracker-design.md §11.3"
      - "doc/design/vscode-review-range-tracker-design.md §12"
      - "Design/BreakingChanges.md (no Issue #59 override)"
    description: >-
      Rev4 still defines Global understanding as reviewed non-empty lines divided by all target non-empty lines and says included repository entries contribute each file's non-empty count. It also describes binary/invalid UTF-8 exclusion after content classification. PR #60 intentionally changes ordinary Global to opened/retained-only line evidence and avoids content-classifying unopened paths, but does not update or explicitly supersede that design contract.
    impact: >-
      The repository's authoritative design and the accepted implementation now specify different denominator and exclusion semantics, so future work following rev4 can legitimately reintroduce the repository-wide scan that Issue #59 removes.
    required_action: >-
      Update the authoritative design with opened/retained denominator semantics, opened/unopened diagnostics, deferred unopened-content classification, and the active-PR immutable full-scan exception; or explicitly record a superseding repository policy if rev4 must remain unchanged.

  - id: R60-003
    severity: medium
    blocking: true
    origin: introduced_by_change
    locations:
      - "src/t505-global-understanding-source.ts: ownerEvidenceKey(), openedEvidenceByOwner, pullRequestEvidenceByOwner, retainedOpenedEvidence(), capturePullRequestHeadFiles(), setContext()"
    description: >-
      T505 cache keys include exact revision, but superseded revision maps are never evicted or bounded. Each new branch/PR revision creates retained evidence maps; PR full scans keep parsed nonEmptyLines and also clone them into retained opened evidence. setContext() only assigns currentContext and performs no lifecycle cleanup.
    impact: >-
      Long-lived Extension Host sessions with repeated commits or PR HEAD updates retain obsolete per-file line-index evidence until restart. Large PRs can make memory grow materially, undermining the performance objective of Issue #59. T405 raw text is invalidated on revision change, but T505 parsed/retained evidence is not.
    required_action: >-
      Evict superseded revision evidence for a stable owner identity or enforce a bounded cache policy across both T505 evidence maps. Add a regression that advances the same owner to a new HEAD and verifies obsolete parsed/retained evidence is no longer retained or reused.

