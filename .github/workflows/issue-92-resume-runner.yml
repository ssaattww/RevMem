name: Issue 92 resume implementation runner

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-resume-runner.yml

permissions:
  contents: write

concurrency:
  group: issue-92-resume-implementation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Prepare diagnostics
        run: mkdir -p test-output/issue-92-resume

      - name: Install dependencies
        run: node tools/run-ci-command.mjs issue92-resume-npm-ci npm ci

      - name: Configure commit identity
        run: |
          git config user.name "RevMem Issue 92 Resume Worker"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Implement Option B selection projection
        id: option_b
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_design']()
          ns['ensure_option_b']()
          PY
          npm run compile:test > test-output/issue-92-resume/option-b.stdout.log 2> test-output/issue-92-resume/option-b.stderr.log
          node --test \
            test-dist/test/unit/original-diff-selection-projection.test.js \
            test-dist/test/unit/issue-92-pr-progress-selection-review.test.js \
            test-dist/test/unit/diff-editor-review-command-service.test.js \
            test-dist/test/unit/review-state-service.test.js \
            test-dist/test/unit/review-history-original-side.test.js \
            test-dist/test/unit/t405-pull-request-review-runtime.test.js \
            >> test-output/issue-92-resume/option-b.stdout.log \
            2>> test-output/issue-92-resume/option-b.stderr.log
          cat test-output/issue-92-resume/option-b.stdout.log test-output/issue-92-resume/option-b.stderr.log > test-output/issue-92-resume/option-b.log
          git diff --check
          git add package.json src/application/repository-global-state src/application/review-commands src/application/review-history src/core/review-state src/t305-extension.ts src/t405-pull-request-review-runtime-base.ts test/unit/issue-92-pr-progress-selection-review.test.ts test/unit/original-diff-selection-projection.test.ts doc/design Design/BreakingChanges.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement mapped PR diff selection review"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit exact revision snapshot tests
        id: red_commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_snapshot_test']()
          ns['ensure_package_test_registration']()
          ns['add_snapshot_storage_contract_test']()
          PY
          git add package.json test/unit/immutable-revision-review-snapshot.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "test: specify exact immutable revision restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Observe snapshot Red
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run compile:test > test-output/issue-92-resume/red.stdout.log 2> test-output/issue-92-resume/red.stderr.log
          status=$?
          set -e
          cat test-output/issue-92-resume/red.stdout.log test-output/issue-92-resume/red.stderr.log > test-output/issue-92-resume/red.log
          jq -n \
            --arg head '${{ steps.red_commit.outputs.sha }}' \
            --argjson exitCode "$status" \
            '{phase:"red",command:"npm run compile:test",headSha:$head,exitCode:$exitCode}' \
            > test-output/issue-92-resume/red.result.json
          if [ "$status" -eq 0 ]; then
            echo "Snapshot test-only state unexpectedly passed." >&2
            exit 1
          fi

      - name: Implement exact immutable revision restoration
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_snapshot_implementation']()
          ns['ensure_option_b']()
          ns['ensure_package_test_registration']()
          ns['ensure_design_contract_test']()
          ns['add_snapshot_storage_contract_test']()
          PY

          npm run compile:test > test-output/issue-92-resume/green.stdout.log 2> test-output/issue-92-resume/green.stderr.log
          node --test \
            test-dist/test/unit/immutable-revision-review-snapshot.test.js \
            test-dist/test/unit/original-diff-selection-projection.test.js \
            test-dist/test/unit/issue-92-pr-progress-selection-review.test.js \
            test-dist/test/unit/diff-editor-review-command-service.test.js \
            test-dist/test/unit/review-state-service.test.js \
            test-dist/test/unit/review-history-original-side.test.js \
            test-dist/test/unit/t405-pull-request-review-runtime.test.js \
            >> test-output/issue-92-resume/green.stdout.log \
            2>> test-output/issue-92-resume/green.stderr.log
          cat test-output/issue-92-resume/green.stdout.log test-output/issue-92-resume/green.stderr.log > test-output/issue-92-resume/green.log

          node tools/run-ci-command.mjs issue92-resume-test-unit npm run test:unit
          node tools/run-ci-command.mjs issue92-resume-lint npm run lint
          node tools/run-ci-command.mjs issue92-resume-build npm run build
          git diff --check

          git add package.json src test doc/design Design/BreakingChanges.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: restore exact immutable revision review state"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg head "$(git rev-parse HEAD)" \
            '{phase:"green",headSha:$head,commands:["focused Issue #92 tests","npm run test:unit","npm run lint","npm run build","git diff --check"],exitCode:0}' \
            > test-output/issue-92-resume/green.result.json

      - name: Write implementation report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          report='reports/2026-08-31-issue-92-selection-and-revision-snapshots.md'
          cat > "$report" <<EOF
          # Issue #92 selection review and immutable revision snapshot report

          ## Scope

          PR Progressから開いたexact diff tabで、ファイル全体だけでなく選択範囲の確認済み／解除を可能にした。Original側選択は、検証済みimmutable diffの座標から、Modified側へ存続するcontext行とOriginal側だけの削除・置換前行へ分割する。

          あわせて、immutable revision Aを確認後にA→B→Cと進み、Cからexact Aへ戻った場合、C→Aのreverse diffによってAの既知確認状態を失わず、保存済みA snapshotを復元する。

          ## Design

          - 主設計: \`doc/design/vscode-review-range-tracker-design.md\` rev9
          - Original selection: \`doc/design/diff-editor-selection-projection.md\`
          - Revision snapshot: \`doc/design/immutable-revision-review-snapshots.md\`
          - 永続化model変更: \`Design/BreakingChanges.md\`
          - PR context identityはrepository + PR番号を維持する。
          - Modified/current stateはHEAD SHA、Original-only stateは\`baseSha..headSha\`を所有単位とする。
          - Historyはaudit evidenceであり、現在状態復元にはreplayしない。

          ## Implementation

          - PR Progress由来の正確なdiff tabだけに、選択範囲とファイル全体の確認／解除4操作を表示する。
          - \`editor/context\` contributionは既存7件を維持する。
          - Original側で存続する行をModified側座標へ投影する。
          - 削除・置換前行を置換後追加行へ推測対応しない。
          - Mixed Original selectionはModified、Global、Original pair stateを1回のatomic repository commitで更新する。
          - Context／Globalへrevision-keyed snapshotを追加する。
          - Target snapshot hit時はreverse diff evidenceを取得せずexact stateを復元する。
          - Snapshot miss時だけ既存Git diff mappingを行い、結果をtarget snapshotへ保存する。
          - Context hit／Global missまたはその逆を同一CAS resultへ統合する。
          - BASEだけが変わりHEADが同じ場合、Modified snapshotを共有し、過去Original pair rangeを保持する。

          ## TDD

          - Option B implementation commit: \`${{ steps.option_b.outputs.sha }}\`
          - Revision snapshot Red commit: \`${{ steps.red_commit.outputs.sha }}\`
          - Revision snapshot implementation commit: \`${{ steps.implementation.outputs.sha }}\`
          - Snapshot test-only stateで\`npm run compile:test\`の失敗を確認した。
          - Redの標準出力、標準エラー、combined log、result JSONをworkflow artifactへ保存した。

          ## Verification

          - focused Issue #92 tests: Green
          - \`npm run test:unit\`: Green
          - \`npm run lint\`: Green
          - \`npm run build\`: Green
          - \`git diff --check\`: Green

          最終pull_request CIは、このreportと一時automation cleanupを含むcurrent HEADに対して、workflow runのhead SHAが完全一致するものだけを確認する。

          ## Review state

          独立レビューは未実施。PRはDraftのまま維持し、mergeしていない。
          EOF
          sed -i 's/^          //' "$report"
          git add "$report"
          git commit -m "docs: report Issue #92 selection and revision snapshots"
          git push origin HEAD:issue-92-pr-progress-context-menu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p test-output/issue-92-resume/meta
          git rev-parse HEAD > test-output/issue-92-resume/meta/head.txt
          git status --short > test-output/issue-92-resume/meta/git-status.txt
          git log --oneline -40 > test-output/issue-92-resume/meta/git-log.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-resume-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            test-output/
            src/
            test/
            doc/design/
            Design/BreakingChanges.md
            reports/
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.test.json
