name: Issue 92 revision snapshot persistence correction

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-revision-snapshot-correction.yml

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: issue-92-revision-snapshot-implementation
  cancel-in-progress: true

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node tools/run-ci-command.mjs issue92-correction-npm-ci npm ci

      - name: Configure commit identity
        run: |
          git config user.name "RevMem Issue 92 Correction Worker"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure design, Option B, and tests
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'VS Code レビュー範囲トラッカー 設計書 rev9' doc/design/vscode-review-range-tracker-design.md; then
            python .github/issue-92-revision-snapshot-worker.py
            git add doc/design Design/BreakingChanges.md
            git commit -m "docs: integrate exact revision snapshot restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi

          python .github/issue-92-option-b-repair.py
          npm run compile:test > issue-92-correction-option-b.stdout.log 2> issue-92-correction-option-b.stderr.log
          node --test \
            test-dist/test/unit/original-diff-selection-projection.test.js \
            test-dist/test/unit/issue-92-pr-progress-selection-review.test.js \
            >> issue-92-correction-option-b.stdout.log 2>> issue-92-correction-option-b.stderr.log
          cat issue-92-correction-option-b.stdout.log issue-92-correction-option-b.stderr.log > issue-92-correction-option-b.combined.log
          if ! git diff --quiet; then
            git add package.json src/application/review-commands src/t405-pull-request-review-runtime-base.ts
            git commit -m "feat: unify PR diff selection projection APIs"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi

          if [ ! -f test/unit/immutable-revision-review-snapshot.test.ts ]; then
            python .github/issue-92-revision-snapshot-implementation.py tests
            git add package.json test/unit/immutable-revision-review-snapshot.test.ts
            git commit -m "test: specify exact revision review restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm revision snapshot Red when not already implemented
        id: red
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/core/review-state/revision-snapshot-service.ts ]; then
            set +e
            npm run compile:test > issue-92-correction-red.stdout.log 2> issue-92-correction-red.stderr.log
            status=$?
            set -e
            cat issue-92-correction-red.stdout.log issue-92-correction-red.stderr.log > issue-92-correction-red.combined.log
            jq -n --arg head "$(git rev-parse HEAD)" --argjson exitCode "$status" \
              '{phase:"red",headSha:$head,exitCode:$exitCode}' > issue-92-correction-red.result.json
            if [ "$status" -eq 0 ]; then
              echo 'revision snapshot tests unexpectedly passed before implementation' >&2
              exit 1
            fi
          else
            jq -n --arg head "$(git rev-parse HEAD)" \
              '{phase:"red-recorded-by-earlier-worker",headSha:$head}' > issue-92-correction-red.result.json
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply snapshot implementation and corrected persistence boundary
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue-92-revision-snapshot-implementation.py implementation
          python .github/issue-92-revision-snapshot-correction.py

          npm run compile:test > issue-92-correction-focused.stdout.log 2> issue-92-correction-focused.stderr.log
          node --test test-dist/test/unit/immutable-revision-review-snapshot.test.js \
            >> issue-92-correction-focused.stdout.log 2>> issue-92-correction-focused.stderr.log
          cat issue-92-correction-focused.stdout.log issue-92-correction-focused.stderr.log > issue-92-correction-focused.combined.log

          npm test > issue-92-correction-test.stdout.log 2> issue-92-correction-test.stderr.log
          cat issue-92-correction-test.stdout.log issue-92-correction-test.stderr.log > issue-92-correction-test.combined.log
          npm run lint > issue-92-correction-lint.stdout.log 2> issue-92-correction-lint.stderr.log
          cat issue-92-correction-lint.stdout.log issue-92-correction-lint.stderr.log > issue-92-correction-lint.combined.log
          npm run build > issue-92-correction-build.stdout.log 2> issue-92-correction-build.stderr.log
          cat issue-92-correction-build.stdout.log issue-92-correction-build.stderr.log > issue-92-correction-build.combined.log
          git diff --check

          git add src test package.json doc/design/immutable-revision-review-snapshots.md
          git commit -m "feat: persist exact PR revision review snapshots"
          git push origin HEAD:issue-92-pr-progress-context-menu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -n --arg head "$(git rev-parse HEAD)" \
            '{phase:"green",headSha:$head,commands:["focused snapshot test","npm test","npm run lint","npm run build","git diff --check"],exitCode:0}' \
            > issue-92-correction-green.result.json

      - name: Finalize pre-review branch state
        id: final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          jq -n \
            --arg prerequisites '${{ steps.prerequisites.outputs.sha }}' \
            --arg red '${{ steps.red.outputs.sha }}' \
            --arg implementation '${{ steps.implementation.outputs.sha }}' \
            '{status:"green",prerequisiteCommit:$prerequisites,redCommit:$red,implementationCommit:$implementation,persistenceBoundary:"pull-request-runtime-and-revision-mapper",reviewStarted:false}' \
            > reports/issue-92-revision-snapshot-worker-result.json

          rm -f .github/issue-92-worker.py
          rm -f .github/issue-92-revision-snapshot-worker.py
          rm -f .github/issue-92-revision-snapshot-implementation.py
          rm -f .github/issue-92-option-b-repair.py
          rm -f .github/issue-92-revision-snapshot-correction.py
          rm -f .github/workflows/issue-92-worker.yml
          rm -f .github/workflows/issue-92-pre-review-finalizer.yml
          rm -f .github/workflows/issue-92-revision-snapshot-design.yml
          rm -f .github/workflows/issue-92-revision-snapshot-implementation.yml
          rm -f .github/workflows/issue-92-revision-snapshot-repair.yml
          rm -f .github/workflows/issue-92-revision-snapshot-correction.yml
          rm -f __connector_probe_do_not_keep__ __schema_probe_do_not_create__

          git add -A
          git commit -m "chore: finalize Issue #92 revision snapshot state"
          git push origin HEAD:issue-92-pr-progress-context-menu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post success note
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-92-revision-snapshot-correction -->
          Immutable revision snapshotをPR runtime／revision mapper境界で実装し、汎用core transactionへのPR固有変更を除去しました。

          - Red commit: \`${{ steps.red.outputs.sha }}\`
          - implementation commit: \`${{ steps.implementation.outputs.sha }}\`
          - worker final HEAD: \`${{ steps.final.outputs.sha }}\`
          - focused / npm test / lint / build / diff-check: Green
          - 独立レビューは未実施です。

          bot pushのrunは最終CI判定へ流用せず、connector-authored report commit後にcurrent HEADとhead_shaが一致するCIを確認します。"
          jq -n --arg body "$body" '{body:$body}' > issue-92-correction-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/94/comments" \
            --data-binary @issue-92-correction-comment.json \
            > issue-92-correction-comment-response.json

      - name: Post failure note
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-92-revision-snapshot-correction-failure -->
          Immutable revision snapshot correctionが失敗しました。標準出力・標準エラー・結果JSONをworkflow artifactへ保存しました。独立レビューは開始していません。"
          jq -n --arg body "$body" '{body:$body}' > issue-92-correction-failure-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/94/comments" \
            --data-binary @issue-92-correction-failure-comment.json \
            > issue-92-correction-failure-comment-response.json || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-revision-snapshot-correction-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            issue-92-correction-*.log
            issue-92-correction-*.json
            reports/issue-92-revision-snapshot-worker-result.json
