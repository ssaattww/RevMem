name: Issue 92 final repair v5

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-final-repair-v5.yml

permissions:
  contents: write

concurrency:
  group: issue-92-final-repair-v5
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Pin branch and prepare diagnostics
        run: |
          git fetch origin issue-92-pr-progress-context-menu
          git reset --hard origin/issue-92-pr-progress-context-menu
          git rev-parse HEAD | tee /tmp/issue-92-final-parent
          mkdir -p test-output/issue-92-final-repair
          cp /tmp/issue-92-final-parent test-output/issue-92-final-repair/parent-head.txt
      - name: Apply implementation when worker is present
        run: |
          if test -f .github/issue-92-final-fixes.py; then
            node tools/run-ci-command.mjs issue-92-final-apply python .github/issue-92-final-fixes.py
          fi
          test -f src/application/review-commands/original-selection-review-plan.ts
          test -f src/core/review-state/revision-snapshot-service.ts
          test -f test/unit/immutable-revision-review-snapshot.test.ts
          ! grep -q '^/mnt/data/' src/application/review-commands/original-selection-review-plan.ts
      - name: Install dependencies
        run: node tools/run-ci-command.mjs issue-92-final-npm-ci npm ci
      - name: Build
        run: node tools/run-ci-command.mjs issue-92-final-build npm run build
      - name: Contract typecheck
        run: node tools/run-ci-command.mjs issue-92-final-typecheck-contracts npm run typecheck:contracts
      - name: Architecture validation
        run: node tools/run-ci-command.mjs issue-92-final-architecture npm run validate:architecture
      - name: Architecture negative contract
        run: node tools/run-ci-command.mjs issue-92-final-architecture-negative npm run validate:architecture:negative
      - name: Lint
        run: node tools/run-ci-command.mjs issue-92-final-lint npm run lint
      - name: Test
        run: node tools/run-ci-command.mjs issue-92-final-test npm test
      - name: Remove all Issue 92 workers and probes
        run: |
          rm -rf .github/issue-92-*
          rm -rf .github/workflows/issue-92-*.yml
          rm -f .github/connector-*.tmp
          rm -f __DO_NOT_KEEP_APPLY_PATCH_PROBE__
          rm -f __connector_probe_do_not_keep__
          rm -f reports/__connector_file_input_test__.md
          rm -f reports/2026-08-31-issue-92-ci-repair.md
      - name: Write final detailed report
        run: |
          python - <<'PY'
          from pathlib import Path

          parent = Path('/tmp/issue-92-final-parent').read_text(encoding='utf-8').strip()
          lines = [
              '# Issue #92 / PR #94 final repair report',
              '',
              '- Branch: `issue-92-pr-progress-context-menu`',
              f'- Repair input HEAD: `{parent}`',
              '- Merge: not performed',
              '- Independent review: not performed',
              '',
              '## Repaired behavior',
              '',
              '- PR Progressから開いたexact diff tabだけに、選択範囲・ファイル全体の確認済み／解除操作を公開する。',
              '- Original側のcontext行はimmutable diff hunk座標でModified側へ投影し、削除行・置換前行はcurrent `baseSha..headSha`の比較固有状態へ保持する。',
              '- Modified Context、Global、Original pairの更新を1回のatomic repository transactionとしてcommitする。',
              '- Context／Globalはfull immutable revisionごとのsnapshotを保持し、`A -> B -> C -> A`ではexact A snapshotを復元する。',
              '- snapshot hit／missはlayerごとに判定し、同じCAS transactionで公開する。',
              '- stale diff tab、PR Progress以外のdiff、同一URIを持つ別tabからの操作は拒否する。',
              '',
              '## TDD evidence',
              '',
              '修復前のPR current HEADに紐づくCIで、未実装契約およびローカルパス文字列だけが保存されたTypeScriptによるRedを確認した。恒久CIと修復workflowは、command result、stdout、stderr、combined logをartifactへ保存する。そのRed契約を維持したまま実装し、下記検証をGreenにした。',
              '',
              '## Verification',
              '',
              '- `npm ci`',
              '- `npm run build`',
              '- `npm run typecheck:contracts`',
              '- `npm run validate:architecture`',
              '- `npm run validate:architecture:negative`',
              '- `npm run lint`',
              '- `npm test`',
              '- `git diff --check`',
              '',
              '## Cleanup',
              '',
              'Issue #92専用のone-shot workflow、Python worker、分割payload、connector probe、およびローカルパスだけを含む誤作成reportを削除した。恒久CIの失敗診断artifact workflowは維持した。',
              '',
              '## Exact-head CI policy',
              '',
              'このreportを含む最終commit後は、PR current HEAD SHAとrunの`head_sha`が完全一致するpull_request CIだけを最終判定に使用する。別SHAのrunは代用しない。一致runが存在しなければCI未実施として扱う。',
              '',
          ]
          Path('reports/2026-08-31-issue-92-final-repair.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Final tree and diff checks
        run: |
          test -z "$(find .github -maxdepth 3 \( -name 'issue-92-*' -o -name 'connector-*.tmp' \) -print)"
          test ! -e __DO_NOT_KEEP_APPLY_PATCH_PROBE__
          test ! -e __connector_probe_do_not_keep__
          if grep -R -n -E '^/mnt/data/issue92|^/mnt/data/issue-92' src test reports doc package.json 2>/dev/null; then
            echo 'local path leak remains' >&2
            exit 1
          fi
          node tools/run-ci-command.mjs issue-92-final-diff-check git diff --check
      - name: Ensure branch did not move during verification
        run: |
          git fetch origin issue-92-pr-progress-context-menu
          test "$(git rev-parse origin/issue-92-pr-progress-context-menu)" = "$(cat /tmp/issue-92-final-parent)"
      - name: Commit verified implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete Issue 92 repair"
          git rev-parse HEAD | tee test-output/issue-92-final-repair/final-head.txt
          git push origin HEAD:issue-92-pr-progress-context-menu
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-final-repair-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-output/
            package.json
            src/
            test/
            doc/design/
            reports/
