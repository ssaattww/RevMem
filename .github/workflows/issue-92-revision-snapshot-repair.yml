name: Issue 92 compatible revision snapshot implementation

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-revision-snapshot-repair.yml

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: issue-92-revision-snapshot-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node tools/run-ci-command.mjs issue92-repair-npm-ci npm ci

      - name: Configure commit identity
        run: |
          git config user.name "RevMem Issue 92 Repair Worker"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure rev9 design is integrated first
        id: design
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'VS Code レビュー範囲トラッカー 設計書 rev9' doc/design/vscode-review-range-tracker-design.md; then
            python .github/issue-92-revision-snapshot-worker.py
            git add doc/design/vscode-review-range-tracker-design.md \
              doc/design/diff-editor-selection-projection.md \
              Design/BreakingChanges.md
            git commit -m "docs: integrate exact revision snapshot restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          grep -q 'C -> A: exact A snapshot' doc/design/vscode-review-range-tracker-design.md
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Implement compatible Option B projection
        id: option_b
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue-92-option-b-repair.py
          npm run compile:test > issue-92-option-b-repair.stdout.log 2> issue-92-option-b-repair.stderr.log
          node --test \
            test-dist/test/unit/original-diff-selection-projection.test.js \
            test-dist/test/unit/issue-92-pr-progress-selection-review.test.js \
            >> issue-92-option-b-repair.stdout.log 2>> issue-92-option-b-repair.stderr.log
          cat issue-92-option-b-repair.stdout.log issue-92-option-b-repair.stderr.log > issue-92-option-b-repair.combined.log
          git diff --check
          if ! git diff --quiet; then
            git add package.json src/application/review-commands src/t405-pull-request-review-runtime-base.ts
            git commit -m "feat: unify PR diff selection projection APIs"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add exact revision restoration tests
        id: red
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f test/unit/immutable-revision-review-snapshot.test.ts ]; then
            python .github/issue-92-revision-snapshot-implementation.py tests
            git add package.json test/unit/immutable-revision-review-snapshot.test.ts
            git commit -m "test: specify exact revision review restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ ! -f src/core/review-state/revision-snapshot-service.ts ]; then
            set +e
            npm run compile:test > issue-92-revision-red.stdout.log 2> issue-92-revision-red.stderr.log
            status=$?
            set -e
            cat issue-92-revision-red.stdout.log issue-92-revision-red.stderr.log > issue-92-revision-red.combined.log
            jq -n --arg head "$(git rev-parse HEAD)" --argjson exitCode "$status" \
              '{phase:"red",command:"npm run compile:test",headSha:$head,exitCode:$exitCode}' \
              > issue-92-revision-red.result.json
            if [ "$status" -eq 0 ]; then
              echo 'test-only revision snapshot state unexpectedly passed' >&2
              exit 1
            fi
          else
            jq -n --arg head "$(git rev-parse HEAD)" \
              '{phase:"red-already-recorded",headSha:$head}' > issue-92-revision-red.result.json
          fi

      - name: Implement and verify immutable revision snapshots
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue-92-revision-snapshot-implementation.py implementation

          npm run compile:test > issue-92-revision-focused.stdout.log 2> issue-92-revision-focused.stderr.log
          node --test test-dist/test/unit/immutable-revision-review-snapshot.test.js \
            >> issue-92-revision-focused.stdout.log 2>> issue-92-revision-focused.stderr.log
          cat issue-92-revision-focused.stdout.log issue-92-revision-focused.stderr.log > issue-92-revision-focused.combined.log

          npm test > issue-92-revision-test.stdout.log 2> issue-92-revision-test.stderr.log
          cat issue-92-revision-test.stdout.log issue-92-revision-test.stderr.log > issue-92-revision-test.combined.log
          npm run lint > issue-92-revision-lint.stdout.log 2> issue-92-revision-lint.stderr.log
          cat issue-92-revision-lint.stdout.log issue-92-revision-lint.stderr.log > issue-92-revision-lint.combined.log
          npm run build > issue-92-revision-build.stdout.log 2> issue-92-revision-build.stderr.log
          cat issue-92-revision-build.stdout.log issue-92-revision-build.stderr.log > issue-92-revision-build.combined.log
          git diff --check

          if ! git diff --quiet; then
            git add src test package.json
            git commit -m "feat: restore exact immutable revision review state"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -n --arg head "$(git rev-parse HEAD)" \
            '{phase:"green",headSha:$head,commands:["focused snapshot test","npm test","npm run lint","npm run build","git diff --check"],exitCode:0}' \
            > issue-92-revision-green.result.json

      - name: Remove temporary automation and publish result
        id: final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          jq -n \
            --arg design '${{ steps.design.outputs.sha }}' \
            --arg optionB '${{ steps.option_b.outputs.sha }}' \
            --arg red '${{ steps.red.outputs.sha }}' \
            --arg implementation '${{ steps.implementation.outputs.sha }}' \
            '{status:"green",designCommit:$design,optionBCommit:$optionB,redCommit:$red,implementationCommit:$implementation,reviewStarted:false}' \
            > reports/issue-92-revision-snapshot-worker-result.json

          rm -f .github/issue-92-worker.py
          rm -f .github/issue-92-revision-snapshot-worker.py
          rm -f .github/issue-92-revision-snapshot-implementation.py
          rm -f .github/issue-92-option-b-repair.py
          rm -f .github/workflows/issue-92-worker.yml
          rm -f .github/workflows/issue-92-pre-review-finalizer.yml
          rm -f .github/workflows/issue-92-revision-snapshot-design.yml
          rm -f .github/workflows/issue-92-revision-snapshot-implementation.yml
          rm -f .github/workflows/issue-92-revision-snapshot-repair.yml
          rm -f __connector_probe_do_not_keep__ __schema_probe_do_not_create__

          git add -A
          git commit -m "chore: finalize Issue #92 pre-review implementation"
          git push origin HEAD:issue-92-pr-progress-context-menu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post success note
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-92-revision-snapshot-repair -->
          Issue #92のOption B互換統合とimmutable revision snapshot実装がGreenになりました。

          - design commit: \`${{ steps.design.outputs.sha }}\`
          - Option B commit: \`${{ steps.option_b.outputs.sha }}\`
          - Red commit: \`${{ steps.red.outputs.sha }}\`
          - implementation commit: \`${{ steps.implementation.outputs.sha }}\`
          - worker final HEAD: \`${{ steps.final.outputs.sha }}\`
          - focused / npm test / lint / build / diff-check: Green
          - 独立レビューは未実施です。

          bot pushの別SHA CIは最終判定に使用せず、connector-authored report commit後のcurrent HEAD一致CIを確認します。"
          jq -n --arg body "$body" '{body:$body}' > issue-92-repair-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/94/comments" \
            --data-binary @issue-92-repair-comment.json \
            > issue-92-repair-comment-response.json

      - name: Post failure note
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-92-revision-snapshot-repair-failure -->
          Issue #92 revision snapshot実装が失敗しました。標準出力・標準エラー・結果JSONはworkflow artifactへ保存しています。独立レビューは開始していません。"
          jq -n --arg body "$body" '{body:$body}' > issue-92-repair-failure-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/94/comments" \
            --data-binary @issue-92-repair-failure-comment.json \
            > issue-92-repair-failure-comment-response.json || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-revision-snapshot-repair-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            issue-92-option-b-repair.*.log
            issue-92-revision-*.log
            issue-92-revision-*.json
            issue-92-repair-*.json
            reports/issue-92-revision-snapshot-worker-result.json
