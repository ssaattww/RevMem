name: Issue 92 repair once

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare diagnostics
        run: mkdir -p test-output/issue-92-repair
      - name: Apply reviewed-state fixes
        run: node tools/run-ci-command.mjs issue-92-apply-fixes python .github/issue-92-final-fixes.py
      - name: Install dependencies
        run: node tools/run-ci-command.mjs issue-92-npm-ci npm ci
      - name: Build
        run: node tools/run-ci-command.mjs issue-92-build npm run build
      - name: Contract typecheck
        run: node tools/run-ci-command.mjs issue-92-typecheck-contracts npm run typecheck:contracts
      - name: Architecture validation
        run: node tools/run-ci-command.mjs issue-92-architecture npm run validate:architecture
      - name: Architecture negative contract
        run: node tools/run-ci-command.mjs issue-92-architecture-negative npm run validate:architecture:negative
      - name: Lint
        run: node tools/run-ci-command.mjs issue-92-lint npm run lint
      - name: Test
        run: node tools/run-ci-command.mjs issue-92-test npm test
      - name: Remove one-shot workers and connector probes
        run: |
          rm -rf .github/issue-92-*
          rm -rf .github/workflows/issue-92-*.yml
          rm -f .github/connector-*.tmp
          rm -f __DO_NOT_KEEP_APPLY_PATCH_PROBE__
          rm -f __connector_probe_do_not_keep__
          rm -f reports/__connector_file_input_test__.md
          rm -f reports/2026-08-31-issue-92-ci-repair.md
      - name: Diff check
        run: node tools/run-ci-command.mjs issue-92-diff-check git diff --check
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete Issue 92 review state handling"
          git rev-parse HEAD | tee test-output/issue-92-repair/final-head.txt
          git push origin HEAD:issue-92-pr-progress-context-menu
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-repair-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-output/
            package.json
            src/
            test/
            doc/design/
            reports/
