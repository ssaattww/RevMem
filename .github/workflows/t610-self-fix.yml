name: T610 one-shot patch

on:
  push:
    branches:
      - fix/issue-90-diagnostics-stale-cancellation

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: apply T610 CI fix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-90-diagnostics-stale-cancellation
      - name: Apply exact T610 cancellation expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/unit/t610-folder-understanding.test.ts')
          text = path.read_text()
          old_import = 'import { OperationFeedback, setActiveOperationFeedback } from "../../src/application/operation-feedback/operation-feedback";'
          new_import = 'import { OperationCancelledError, OperationFeedback, setActiveOperationFeedback } from "../../src/application/operation-feedback/operation-feedback";'
          old_wait = '  await initialRefresh;\n  assert.equal(stopCalls, 1);'
          new_wait = '''  await assert.rejects(\n    initialRefresh,\n    (error: unknown) => error instanceof OperationCancelledError,\n    "the stopped running generation terminates as typed cancellation",\n  );\n  assert.equal(stopCalls, 1);'''
          assert text.count(old_import) == 1
          assert text.count(old_wait) == 1
          text = text.replace(old_import, new_import, 1).replace(old_wait, new_wait, 1)
          path.write_text(text)
          PY
          git rm .github/workflows/t610-self-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/unit/t610-folder-understanding.test.ts
          git commit -m 'fix(t610): align cancellation regression contract'
          git push origin HEAD:fix/issue-90-diagnostics-stale-cancellation
