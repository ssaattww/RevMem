name: Issue 92 revision snapshot design

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-revision-design.yml

permissions:
  contents: write

concurrency:
  group: issue-92-revision-snapshot-design
  cancel-in-progress: false

jobs:
  design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0
      - name: Apply exact revision snapshot design
        shell: bash
        env:
          DESIGN_PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$DESIGN_PATCH_GZIP_BASE64" | base64 -d | gzip -d > /tmp/issue-92-revision-design.patch
          git apply --check /tmp/issue-92-revision-design.patch
          git apply /tmp/issue-92-revision-design.patch
          rm -f doc/design/diff-editor-selection-projection.md
      - name: Commit design before implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RevMem Issue 92 Design Worker"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/design/vscode-review-range-tracker-design.md doc/design/diff-editor-selection-projection.md
          git diff --cached --check
          git commit -m "docs: define exact revision review snapshots"
          git push origin HEAD:issue-92-pr-progress-context-menu
