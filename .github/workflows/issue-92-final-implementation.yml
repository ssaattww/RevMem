name: Issue 92 final pre-review implementation

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-final-implementation.yml

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: issue-92-revision-snapshot-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v5
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: node tools/run-ci-command.mjs issue92-final-npm-ci npm ci

      - name: Configure commit identity
        run: |
          git config user.name "RevMem Issue 92 Final Worker"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Integrate rev9 design before implementation
        id: design
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_design']()
          PY
          grep -q 'VS Code レビュー範囲トラッカー 設計書 rev9' doc/design/vscode-review-range-tracker-design.md
          grep -q 'C -> A: exact A snapshot' doc/design/vscode-review-range-tracker-design.md
          grep -q 'Immutable revision review snapshots' Design/BreakingChanges.md
          git diff --check
          if ! git diff --quiet; then
            git add doc/design Design/BreakingChanges.md
            git commit -m "docs: integrate exact revision snapshot restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Complete Option B selection projection
        id: option_b
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_option_b']()
          PY
          npm run compile:test > issue-92-final-option-b.stdout.log 2> issue-92-final-option-b.stderr.log
          node --test \
            test-dist/test/unit/original-diff-selection-projection.test.js \
            test-dist/test/unit/issue-92-pr-progress-selection-review.test.js \
            >> issue-92-final-option-b.stdout.log 2>> issue-92-final-option-b.stderr.log
          cat issue-92-final-option-b.stdout.log issue-92-final-option-b.stderr.log > issue-92-final-option-b.combined.log
          git diff --check
          if ! git diff --quiet; then
            git add package.json src/application/review-commands src/t405-pull-request-review-runtime-base.ts
            git commit -m "feat: complete mapped PR diff selection review"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit exact revision snapshot tests before implementation
        id: red
        shell: bash
        run: |
          set -euo pipefail
          created="$(python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          print('true' if ns['ensure_snapshot_test']() else 'false')
          PY
          )"
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_package_test_registration']()
          ns['add_snapshot_storage_contract_test']()
          PY
          if ! git diff --quiet; then
            git add package.json test/unit/immutable-revision-review-snapshot.test.ts
            git commit -m "test: specify exact immutable revision restoration"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          red_sha="$(git log -1 --format=%H --grep='test: specify exact.*revision.*restoration' || true)"
          if [ -z "$red_sha" ]; then
            red_sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$red_sha" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Observe Red before snapshot implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/core/review-state/revision-snapshot-service.ts ]; then
            set +e
            npm run compile:test > issue-92-final-red.stdout.log 2> issue-92-final-red.stderr.log
            status=$?
            set -e
            cat issue-92-final-red.stdout.log issue-92-final-red.stderr.log > issue-92-final-red.combined.log
            jq -n \
              --arg head '${{ steps.red.outputs.sha }}' \
              --argjson exitCode "$status" \
              '{phase:"red",command:"npm run compile:test",headSha:$head,exitCode:$exitCode}' \
              > issue-92-final-red.result.json
            if [ "$status" -eq 0 ]; then
              echo 'snapshot test-only state unexpectedly passed' >&2
              exit 1
            fi
          else
            jq -n \
              --arg head '${{ steps.red.outputs.sha }}' \
              '{phase:"red-recorded-before-current-worker",headSha:$head}' \
              > issue-92-final-red.result.json
          fi

      - name: Implement exact revision snapshot restoration
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('.github/issue-92-final-fixes.py')
          ns['ensure_snapshot_implementation']()
          ns['ensure_package_test_registration']()
          ns['ensure_design_contract_test']()
          ns['add_snapshot_storage_contract_test']()
          PY

          npm run compile:test > issue-92-final-focused.stdout.log 2> issue-92-final-focused.stderr.log
          node --test \
            test-dist/test/unit/immutable-revision-review-snapshot.test.js \
            test-dist/test/unit/original-diff-selection-projection.test.js \
            test-dist/test/unit/issue-92-pr-progress-selection-review.test.js \
            >> issue-92-final-focused.stdout.log 2>> issue-92-final-focused.stderr.log
          cat issue-92-final-focused.stdout.log issue-92-final-focused.stderr.log > issue-92-final-focused.combined.log

          npm test > issue-92-final-test.stdout.log 2> issue-92-final-test.stderr.log
          cat issue-92-final-test.stdout.log issue-92-final-test.stderr.log > issue-92-final-test.combined.log
          npm run lint > issue-92-final-lint.stdout.log 2> issue-92-final-lint.stderr.log
          cat issue-92-final-lint.stdout.log issue-92-final-lint.stderr.log > issue-92-final-lint.combined.log
          npm run build > issue-92-final-build.stdout.log 2> issue-92-final-build.stderr.log
          cat issue-92-final-build.stdout.log issue-92-final-build.stderr.log > issue-92-final-build.combined.log
          git diff --check

          if ! git diff --quiet; then
            git add src test package.json doc/design
            git commit -m "feat: restore exact immutable revision review state"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg head "$(git rev-parse HEAD)" \
            '{phase:"green",headSha:$head,commands:["focused Issue #92 tests","npm test","npm run lint","npm run build","git diff --check"],exitCode:0}' \
            > issue-92-final-green.result.json

      - name: Write detailed implementation report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          report='reports/2026-08-31-issue-92-exact-revision-snapshot-restoration.md'
          cat > "$report" <<EOF
          # Issue #92 exact immutable revision restoration report

          ## Scope

          PR Progressから開いたexact diff tabで、ファイル全体だけでなく選択範囲の確認済み／解除を可能にした。Original側の選択は、検証済みimmutable diffの座標から、Modified側へ存続するcontext行とOriginal側だけの削除・置換前行へ分割する。

          あわせて、immutable revision Aを確認後にA→B→Cと進み、Cからexact Aへ戻った場合、C→Aのreverse diffによってAの既知確認状態を失わず、保存済みA snapshotを復元する仕様と実装を追加した。

          ## Design

          - 主設計をrev9へ更新した。
          - 詳細設計: \`doc/design/immutable-revision-review-snapshots.md\`
          - Original selection詳細設計: \`doc/design/diff-editor-selection-projection.md\`
          - 永続化model変更を\`Design/BreakingChanges.md\`へ記録した。
          - PR context identityはrepository + PR番号のまま維持する。
          - Modified/current stateはHEAD SHAごとのsnapshot、Original-only stateは\`baseSha..headSha\`ごとのrangeとして保持する。
          - Historyはaudit evidenceのままとし、現在状態の復元にreplayしない。

          ## Implementation

          - PR Progress由来の正確なdiff tabだけに、選択範囲とファイル全体の確認／解除4操作を表示する。
          - \`editor/context\` contributionは既存7件を維持する。
          - Original側の未変更行をModified側座標へ投影する。
          - 削除行と置換前行を置換後追加行へ推測対応させない。
          - Mixed Original selectionはModified、Global、Original pair stateを1回のatomic repository commitで更新する。
          - Context／Globalへrevision-keyed snapshotを追加する。
          - Target snapshot hit時はreverse diff evidenceを取得せずexact stateを復元する。
          - Snapshot miss時だけ既存Git diff mappingを行い、その結果をtarget snapshotへ保存する。
          - Context hit／Global missまたはその逆を同一CAS resultへ統合する。
          - BASEだけが変わりHEADが同じ場合、Modified snapshotを共有し、過去Original pair rangeを保持する。
          - 汎用core range transactionへPR固有snapshot処理を混入させず、PR revision mapperとPR runtime persistence boundaryへ限定した。

          ## TDD

          - Design commit: \`${{ steps.design.outputs.sha }}\`
          - Option B implementation commit: \`${{ steps.option_b.outputs.sha }}\`
          - Revision snapshot Red commit: \`${{ steps.red.outputs.sha }}\`
          - Revision snapshot implementation commit: \`${{ steps.implementation.outputs.sha }}\`
          - Redではsnapshot API／contract未実装による\`npm run compile:test\` failureを確認し、標準出力・標準エラー・combined log・result JSONをworkflow artifactへ保存した。

          ## Verification

          次をGreenとして確認した。

          - focused Issue #92 tests
          - \`npm test\`
          - \`npm run lint\`
          - \`npm run build\`
          - \`git diff --check\`

          検証対象にはA→B→C→A exact restore、snapshot hit/miss、Context／Global mixed restore、snapshot isolation、base-only pair retention、corrupt snapshot rejection、Option B Original projection、context menu 7件維持を含む。

          ## Migration and retention

          - \`revisionSnapshots\`がないlegacy stateは現在HEADのsnapshotだけをlazy作成する。
          - Upgrade前の過去revisionをhistoryから推測復元しない。
          - 初期実装ではrevision snapshotを自動削除しない。
          - 不整合snapshotや別revision snapshotを代用しない。

          ## Review state

          独立レビューは未実施。PRはDraftのまま維持し、mergeしていない。

          最終pull_request CIは、このreportを含むconnector-authored current HEADに対し、workflow runのhead SHAが完全一致するものだけを別途確認する。
          EOF
          sed -i 's/^          //' "$report"
          git add "$report"
          git commit -m "docs: report Issue #92 revision restoration"
          git push origin HEAD:issue-92-pr-progress-context-menu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove temporary Issue #92 automation
        id: final
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue-92-worker.py
          rm -f .github/issue-92-revision-snapshot-worker.py
          rm -f .github/issue-92-revision-snapshot-implementation.py
          rm -f .github/issue-92-option-b-repair.py
          rm -f .github/issue-92-revision-snapshot-correction.py
          rm -f .github/issue-92-final-fixes.py
          rm -f .github/workflows/issue-92-worker.yml
          rm -f .github/workflows/issue-92-pre-review-finalizer.yml
          rm -f .github/workflows/issue-92-revision-snapshot-design.yml
          rm -f .github/workflows/issue-92-revision-snapshot-implementation.yml
          rm -f .github/workflows/issue-92-revision-snapshot-repair.yml
          rm -f .github/workflows/issue-92-revision-snapshot-correction.yml
          rm -f .github/workflows/issue-92-final-implementation.yml
          rm -f __connector_probe_do_not_keep__ __schema_probe_do_not_create__

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize Issue #92 pre-review state"
            git push origin HEAD:issue-92-pr-progress-context-menu
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg design '${{ steps.design.outputs.sha }}' \
            --arg optionB '${{ steps.option_b.outputs.sha }}' \
            --arg red '${{ steps.red.outputs.sha }}' \
            --arg implementation '${{ steps.implementation.outputs.sha }}' \
            --arg report '${{ steps.report.outputs.sha }}' \
            --arg final "$(git rev-parse HEAD)" \
            '{status:"green",designCommit:$design,optionBCommit:$optionB,redCommit:$red,implementationCommit:$implementation,reportCommit:$report,finalHead:$final,reviewStarted:false}' \
            > issue-92-final-worker-result.json

      - name: Post worker success note
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-92-final-worker -->
          Issue #92の設計rev9、Option B選択範囲、exact immutable revision復元をレビュー前状態まで実装しました。

          - Red commit: \`${{ steps.red.outputs.sha }}\`
          - implementation commit: \`${{ steps.implementation.outputs.sha }}\`
          - report commit: \`${{ steps.report.outputs.sha }}\`
          - worker final HEAD: \`${{ steps.final.outputs.sha }}\`
          - focused / npm test / lint / build / diff-check: Green
          - 詳細report: \`reports/2026-08-31-issue-92-exact-revision-snapshot-restoration.md\`
          - 独立レビューは未実施です。PRはDraftのままです。

          bot pushのrunを最終CI判定へ代用せず、次のconnector-authored commit後にcurrent HEADとhead SHAが一致するpull_request CIだけを確認します。"
          jq -n --arg body "$body" '{body:$body}' > issue-92-final-worker-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/94/comments" \
            --data-binary @issue-92-final-worker-comment.json \
            > issue-92-final-worker-comment-response.json

      - name: Post worker failure note
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-92-final-worker-failure -->
          Issue #92 final workerが失敗しました。標準出力、標準エラー、combined log、result JSONおよび作業treeをartifactへ保存しました。独立レビューは開始していません。"
          jq -n --arg body "$body" '{body:$body}' > issue-92-final-worker-failure-comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/94/comments" \
            --data-binary @issue-92-final-worker-failure-comment.json \
            > issue-92-final-worker-failure-comment-response.json || true

      - name: Collect worker environment
        if: always()
        shell: bash
        run: |
          mkdir -p issue-92-final-diagnostics
          git rev-parse HEAD > issue-92-final-diagnostics/head.txt
          git status --short > issue-92-final-diagnostics/git-status.txt
          git log --oneline -30 > issue-92-final-diagnostics/git-log.txt
          cp issue-92-*.log issue-92-*.json issue-92-final-diagnostics/ 2>/dev/null || true

      - name: Upload final worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-final-worker-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            issue-92-final-diagnostics/
            src/
            test/
            doc/design/
            Design/BreakingChanges.md
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.test.json
            .github/workflows/ci.yml
