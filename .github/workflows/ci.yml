name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare diagnostic output
        run: mkdir -p test-output/ci
      - name: Install dependencies
        run: node tools/run-ci-command.mjs npm-ci npm ci
      - name: Build
        run: node tools/run-ci-command.mjs build npm run build
      - name: Contract typecheck
        run: node tools/run-ci-command.mjs typecheck-contracts npm run typecheck:contracts
      - name: Architecture validation
        run: node tools/run-ci-command.mjs architecture npm run validate:architecture
      - name: Architecture negative contract
        run: node tools/run-ci-command.mjs architecture-negative npm run validate:architecture:negative
      - name: Lint
        run: node tools/run-ci-command.mjs lint npm run lint
      - name: Unit tests
        run: node tools/run-ci-command.mjs test-unit npm run test:unit
      - name: T602 history rewrite recovery tests
        run: node tools/run-ci-command.mjs test-t602 node --test test-dist/test/unit/history-rewrite-recovery.test.js test-dist/test/unit/history-rewrite-recovery-conservative.test.js test-dist/test/unit/history-rewrite-git-context-integration.test.js test-dist/test/unit/history-rewrite-tree-enumeration.test.js test-dist/test/unit/local-git-tree-list.test.js test-dist/test/unit/document-git-history-rewrite-runtime.test.js
      - name: T603 schema migration and corruption recovery tests
        run: |
          node tools/run-ci-command.mjs test-t603-schema node --test test-dist/test/unit/t603-schema-migration-recovery.test.js test-dist/test/unit/t603-history-multi-context-regression.test.js test-dist/test/unit/t603-history-reset-decision.test.js test-dist/test/unit/t603-fix-verification-r3.test.js test-dist/test/unit/t603-fix-verification-r5.test.js test-dist/test/unit/t603-handoff-r016.test.js test-dist/test/unit/t603-r013-startup-owner-regression.test.js test-dist/test/unit/review-history-jsonl-store.test.js
          node tools/run-ci-command.mjs test-t603-findings node --test --test-name-pattern='T603-R00[1-7]|T603-R009|T603-R010|T603-R011|T603-R014' test-dist/test/unit/t603-review-findings.test.js
      - name: T403 GitHub cache tests
        run: node tools/run-ci-command.mjs test-t403 npm run test:t403
      - name: T404 GitHub PR context layer tests
        run: |
          node tools/run-ci-command.mjs t404-compile-test npm run compile:test
          node tools/run-ci-command.mjs test-t404 node --test test-dist/test/unit/github-pr-context-layer-store.test.js
      - name: T405 Review Contexts follow-up tests
        run: node tools/run-ci-command.mjs test-t405 npm run test:t405
      - name: T406 GitHub PR integration tests
        run: node tools/run-ci-command.mjs test-t406 npm run test:t406
      - name: T304 PR progress tree tests
        run: node tools/run-ci-command.mjs test-t304 npm run test:t304
      - name: T502 Global mapping and display priority tests
        run: node tools/run-ci-command.mjs test-t502 npm run test:t502
      - name: T503 repository enumeration tests
        run: |
          node tools/run-ci-command.mjs t503-compile-test npm run compile:test
          node tools/run-ci-command.mjs test-t503 node --test test-dist/test/unit/repository-file-enumerator.test.js
      - name: T504 Global understanding tests
        run: |
          node tools/run-ci-command.mjs t504-compile-test npm run compile:test
          node tools/run-ci-command.mjs test-t504 node --test test-dist/test/unit/global-understanding-progress.test.js test-dist/test/unit/t504-review-followup.test.js test-dist/test/unit/t504-review-followup-r2.test.js
      - name: T505 Global understanding tests
        run: node tools/run-ci-command.mjs test-t505 npm run test:t505
      - name: T506 Global multi-context integration
        run: node tools/run-ci-command.mjs test-t506 xvfb-run -a npm run test:t506
      - name: T604 storage lock and cleanup tests
        run: node tools/run-ci-command.mjs test-t604 npm run test:t604
      - name: T605 multi-root and remote workspace boundary tests
        run: node tools/run-ci-command.mjs test-t605 npm run test:t605
      - name: T606 failure policy and diagnostics tests
        run: node tools/run-ci-command.mjs test-t606 npm run test:t606
      - name: T609 repository and encoding tests
        run: |
          node tools/run-ci-command.mjs test-t609 npm run test:t609
          node tools/run-ci-command.mjs test-t609-extension-host xvfb-run -a npm run test:t609:extension-host
      - name: T610 folder Global Understanding tests
        run: node tools/run-ci-command.mjs test-t610 npm run test:t610
      - name: Temporary Git integration tests
        run: node tools/run-ci-command.mjs test-git npm run test:git
      - name: Mock GitHub integration tests
        run: node tools/run-ci-command.mjs test-github npm run test:github
      - name: VS Code Extension Host tests
        run: node tools/run-ci-command.mjs test-vscode xvfb-run -a npm run test:vscode
      - name: Collect failure context
        if: failure()
        run: |
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
          } > test-output/ci/environment.txt
          git status --short > test-output/ci/git-status.txt
          find dist test-dist -maxdepth 5 -type f -print 2>/dev/null | sort > test-output/ci/generated-files.txt || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-output/
            dist/
            test-dist/
            src/
            test/
            tools/
            type-fixtures/
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.test.json
            eslint.config.mjs
            .github/workflows/ci.yml
            npm-debug.log*
