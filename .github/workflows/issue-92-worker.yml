name: Issue 92 selection review worker

on:
  push:
    branches:
      - issue-92-pr-progress-context-menu
    paths:
      - .github/workflows/issue-92-worker.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: issue-92-pr-progress-context-menu
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure commit identity
        run: |
          git config user.name "RevMem Issue 92 Worker"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit design change first
        run: |
          python .github/issue-92-worker.py design .
          git add doc/design/vscode-review-range-tracker-design.md
          git commit -m "docs: define original-side selection review semantics"
          git push origin HEAD:issue-92-pr-progress-context-menu

      - name: Commit failing tests
        run: |
          python .github/issue-92-worker.py tests .
          git add test/unit/issue-92-pr-progress-selection-review.test.ts
          git commit -m "test: specify mapped PR diff selection review"
          git push origin HEAD:issue-92-pr-progress-context-menu

      - name: Confirm Red and capture diagnostics
        shell: bash
        run: |
          set +e
          npm test > issue-92-red.stdout.log 2> issue-92-red.stderr.log
          status=$?
          set -e
          cat issue-92-red.stdout.log issue-92-red.stderr.log > issue-92-red.combined.log
          printf '{"phase":"red","command":"npm test","exitCode":%s}\n' "$status" > issue-92-red.result.json
          if [ "$status" -eq 0 ]; then
            echo "The test-only commit unexpectedly passed." >&2
            exit 1
          fi

      - name: Implement option B and run Green verification
        shell: bash
        run: |
          python .github/issue-92-worker.py implementation .
          npm test > issue-92-green-test.stdout.log 2> issue-92-green-test.stderr.log
          cat issue-92-green-test.stdout.log issue-92-green-test.stderr.log > issue-92-green-test.combined.log
          npm run lint > issue-92-green-lint.stdout.log 2> issue-92-green-lint.stderr.log
          cat issue-92-green-lint.stdout.log issue-92-green-lint.stderr.log > issue-92-green-lint.combined.log
          npm run build > issue-92-green-build.stdout.log 2> issue-92-green-build.stderr.log
          cat issue-92-green-build.stdout.log issue-92-green-build.stderr.log > issue-92-green-build.combined.log
          printf '{"phase":"green","commands":["npm test","npm run lint","npm run build"],"exitCode":0}\n' > issue-92-green.result.json

      - name: Commit implementation and remove temporary worker files
        shell: bash
        run: |
          rm -f .github/issue-92-worker.py .github/workflows/issue-92-worker.yml
          rm -f __connector_probe_do_not_keep__ __schema_probe_do_not_create__
          git add -A
          git commit -m "feat: review mapped PR diff selections atomically"
          git push origin HEAD:issue-92-pr-progress-context-menu

      - name: Upload TDD and verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-92-selection-review-worker-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            issue-92-red.*.log
            issue-92-red.result.json
            issue-92-green-*.log
            issue-92-green.result.json
