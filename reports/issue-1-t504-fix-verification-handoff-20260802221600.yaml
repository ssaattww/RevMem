findings:
  - id: T504-R2-P1
    severity: high
    origin: introduced_by_fix
    location: src/adapters/repository-files/node-global-understanding-file-source.ts load()/analyzeContent()
    description: Metadata is checked before cooperative analysis; a file changed during an injected yield is not revalidated before stale Buffer evidence is returned.
    impact: A changed current file can be counted as reviewed when its old Buffer hash still matches Global state.
    evidence: await analyzeContent follows the final lstat and contains yield points; no lstat follows analysis.
    required_action: Add a Red test that writes during in-file yield, then perform a final metadata check after analysis with no later yield before return.
  - id: T504-R2-P2
    severity: medium
    origin: introduced_by_change
    location: global-understanding-background-recalculator.ts evidenceKey/file loop and global-understanding-progress.ts normalizeReviewed/countReviewedNonEmptyLines
    description: Evidence serialization, interval normalization/sort, and non-empty-line intersection remain synchronous and unbounded after source load.
    impact: One file with many lines or intervals can still monopolize the Extension Host event loop.
    evidence: No await or scheduler checkpoint exists in those operations; tests only observe source-level yields.
    required_action: Add Red coverage and make evidence/interval/intersection processing incremental or explicitly bounded by a designed exclusion limit.

