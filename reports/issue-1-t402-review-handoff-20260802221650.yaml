findings:
  - id: T402-R001
    severity: high
    origin: introduced_by_change
    location: src/application/github-pr-diff/content-diff-builder.ts editOperations / hunksFromContents
    description: Independent LCS alignment can produce changed coordinates different from Git/GitHub while additions/deletions statistics still match.
    impact: PR progress can mark the wrong lines reviewed or leave actual changed lines unreviewed.
    evidence: old a\n, new b\na\na\n gives Git additions at 1,2 and T402 additions at 1,3; both count two additions.
    required_action: Use Git-compatible coordinates or fail closed on ambiguous alignment; add the repeated-line fixture test-first.
  - id: T402-R002
    severity: high
    origin: introduced_by_change
    location: src/adapters/github/fetch-github-pull-request-diff-adapter.ts statusFrom / parseFile and github-patch-diff-builder.ts zero-change branch
    description: GitHub changed is collapsed to modified, binary relies on a non-standard status, and patchless zero-stat records are accepted without classification evidence.
    impact: Binary exclusion and type-change semantics are bypassed, producing incorrect progress categories and unsupported diff documents.
    evidence: Official PatchStatus defines CHANGED as type change and has no BINARY; current zero-change branch returns success without content fallback.
    required_action: Model or reject type change, classify binary through trusted evidence or fail closed, and test standard status/binary behavior.
  - id: T402-R003
    severity: medium
    origin: introduced_by_change
    location: src/adapters/local-git/local-git-pull-request-diff-adapter.ts Git diff arguments
    description: --find-copies does not inspect unmodified files as copy sources without --find-copies-harder.
    impact: Pure copies are classified as added and all copied lines inflate PR review progress.
    evidence: Temporary repository reproduction emitted 3 added lines with current command and copy metadata with --find-copies-harder.
    required_action: Define bounded pure-copy semantics and add a real temporary-repository TDD case before changing Git options.
  - id: T402-R004
    severity: high
    origin: introduced_by_change
    location: src/adapters/github/fetch-github-pull-request-diff-adapter.ts nextPage and files loop
    description: Pagination accepts arbitrary same-path query transitions and has no request/page bound when file count does not grow.
    impact: Empty unique next pages can loop forever, and page jumps can omit changed files while returning a complete result.
    evidence: Loop termination uses only exact URL repetition and 3000 accumulated files; page/per_page sequence is not validated.
    required_action: Enforce monotonic fixed pagination and an explicit maximum request count; reject empty-next, page jumps, regressions, and query mutation with tests.

