  - Read an existing VS Code GitHub authentication session without forcing login.
  - Search open pull requests through authenticated or unauthenticated public REST API access.
  - Filter candidates by exact immutable HEAD SHA.
  - Resolve zero, one, and multiple candidates and preserve branch operation on fallback.
  - Classify rate-limit, network, and API failure without blocking local review operations.
non_goals:
  - PR files API and patch/diff fallback.
  - GitHub metadata cache and offline persistence.
  - Persistent PR context layers and Review Contexts UI.
  - Merge or release.

