findings:
  - id: T504-R1-P1
    severity: high
    origin: introduced_by_change
    location: src/core/global-understanding/global-understanding-progress.ts isCurrentGlobalFile
    description: A matching path and revision is treated as current when either snapshot or Global content hash is missing.
    impact: Changed current bytes can retain old reviewed ranges and overstate Global understanding, violating certainty-first behavior.
    evidence: GlobalFileReviewState.contentHash is optional and T501 can persist a hashless state; the T504 predicate uses OR for missing hashes and no missing-hash test exists.
    required_action: Add Red tests for one-sided missing hashes and require exact hash equality whenever exact content evidence is available; otherwise introduce an explicit weaker evidence mode with a separately tested contract.
  - id: T504-R1-P2
    severity: medium
    origin: introduced_by_change
    location: src/adapters/repository-files/node-global-understanding-file-source.ts splitLogicalLines and core normalizeReviewed
    description: A zero-byte file is loaded with lineCount 0 although editor/state operations can validly persist a matching Global interval [0,1).
    impact: One empty file with current Global state can throw and abort the whole repository recalculation instead of contributing zero non-empty lines.
    evidence: The source returns [] for empty content; VS Code empty documents use one logical line; the focused empty-file test has no Global state and does not reach interval validation.
    required_action: Add a Red test using a real empty file and current [0,1) state; align source lineCount with editor semantics while keeping nonEmptyLines empty.
  - id: T504-R1-P3
    severity: medium
    origin: introduced_by_change
    location: src/application/global-understanding/global-understanding-background-recalculator.ts chunk loop and Node source synchronous scan/hash
    description: Cooperative yielding occurs only between non-final file chunks, while a single large file is decoded, split, scanned and hashed synchronously.
    impact: A one-file or final-chunk workload can block the Extension Host for an unbounded period, so the T504 event-loop acceptance condition is not established.
    evidence: Focused tests use four small files and only assert one inter-chunk yield; there is no single-large-file work-budget test or intra-file yield.
    required_action: Add deterministic Red coverage for a single large file and implement streamed or bounded chunk processing with cooperative yields, or define an authorized size exclusion contract.
  - id: T504-R1-P4
    severity: low
    origin: introduced_by_change
    location: reports/issue-1-t504-handoff-20260802211500.yaml
    description: The newly generated implementation handoff uses schema_version 1 instead of the required writer schema version 3.
    impact: Standard fields for head identity, permissions, findings continuity, validation, uncertainty and next-chat authorization are not transferred losslessly.
    evidence: Current chat-handoff-manager contract requires writers to emit schema version 3; versions 1 and 2 are reader compatibility only.
    required_action: Regenerate the implementation/fix handoff as schema v3 with the new implementation head, exact-head CI, TDD evidence, findings, permissions, risks and raw source payloads.

