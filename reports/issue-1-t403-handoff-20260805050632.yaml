scope:
  - Wrap the immutable T402 acquisition boundary with exact-identity GitHub PR metadata and diff caching.
  - Persist cache freshness timestamps and expose fresh or stale offline status.
  - Read cache only after GitHub rate-limit or network failure.
  - Preserve enough file, hunk, and line-coordinate evidence for offline PR display and progress while redacting source text.
  - Keep tokens and unknown runtime fields out of persisted documents.
  - Publish metadata and diff generations consistently through an atomic latest pointer.
non_goals:
  - Persisting PR review-state layers or multiple PR contexts.
  - Wiring the cache into the current VSIX UI or Review Contexts View.
  - Reconstructing source text from the offline cache.
  - Multi-process locking, cache cleanup, generation retention, or capacity policy.
  - Task tracking updates, merge, release, or independent review.

