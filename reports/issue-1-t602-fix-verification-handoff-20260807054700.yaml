findings:
  - id: T602-R010
    severity: high
    origin: introduced_by_fix
    location: src/adapters/document-review-state/persisted-document-review-state-session-provider.ts open/readProvenContent/enqueueSnapshotCommit
    description: A stale open can wait in readProvenContent outside the publication queue; a newer commit can enqueue and publish first, after which the stale open enqueues its older state and overwrites the latest snapshot pointer.
    impact: Explicitly unreviewed ranges may be restored as reviewed after a later rebase or force-push.
    evidence: open awaits readProvenContent before enqueueSnapshotCommit. Added race test delays saveLatest only after stale open is already queued and therefore misses the reverse-arrival ordering.
    required_action: Add generation/expected-state validation covering open from state capture through publication, and test delayed readProvenContent where newer commit completes before stale open enqueue.

