scope:
  - Resolve one exact pull request comparison by repository identity, PR number, base SHA, and head SHA.
  - Use local Git, complete GitHub patches, then exact base/head contents in that order.
  - Produce the existing T301 PullRequestDiffSnapshot only from complete validated evidence.
  - Validate status/path/statistics/hunk/patch/content consistency and retain failed-route reasons.
  - Fetch paginated PR file records and exact immutable raw contents with bounded, validated pagination.
  - Reject ambiguous API caps, invalid paths/revisions, identity mismatch, malformed or incomplete patches, oversized content diffs, and total acquisition failure.
non_goals:
  - T403 metadata or diff cache.
  - T404 persistent PR context layer.
  - T405 Review Contexts View and runtime composition.
  - Task tracking updates, merge, or release.

