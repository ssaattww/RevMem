findings:
  - id: T402-R003
    severity: medium
    origin: introduced_by_change
    location: src/adapters/local-git/local-git-pull-request-diff-adapter.ts executeDiff ordinary pass
    description: Pure-copy detection is fixed, but the preliminary --find-renames/--find-copies command does not pass an explicit non-zero -l limit and can inherit diff.renameLimit=0 or a large configured value.
    impact: The first local acquisition process can execute unbounded or unexpectedly large O(N^2) rename/copy fallback work before the bounded harder pass is considered.
    evidence: executeDiff(false) builds copyArguments as only --find-copies; Git documentation states omitted -l defaults to diff.renameLimit and 0 is unlimited.
    required_action: Add an explicit non-zero -l limit to the ordinary pass and cover both ordinary and harder invocations under repository diff.renameLimit=0.
  - id: T402-R004
    severity: high
    origin: introduced_by_change
    location: src/adapters/github/fetch-github-pull-request-diff-adapter.ts parseMetadata / nextPage / fetch termination
    description: Page jumps and unbounded chains are fixed, but absence of a Link header is treated as complete without comparing fetched files to Get Pull Request changed_files metadata.
    impact: A missing or stripped Link header can omit later changed files while the adapter returns an available partial list, causing PR progress to exclude real changed files.
    evidence: parseMetadata does not read changed_files; nextPage returns none on Link=null; fetch returns available without total-count validation.
    required_action: Parse and validate changed_files and require exact count agreement at pagination termination, with a regression for changed_files=2, one returned file, and no Link.

