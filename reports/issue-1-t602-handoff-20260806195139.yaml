scope:
  - Ordered recovery after rebase or force-push.
  - Direct immutable Git evidence remains authoritative.
  - Snapshot fallback only after old-object absence is proven.
  - Stable identity only for one unique path/content mapping.
  - Independent context and Global snapshot evidence.
  - Production Git session snapshot publication and generation invalidation.
non_goals:
  - T603 schema migration and corruption quarantine.
  - T604 cross-window locking and history atomicity.
  - T606 comprehensive retry and privacy-safe diagnostic policy.
  - T607 large-scale performance optimization.
  - Merge, release, normal review, or independent final review.

