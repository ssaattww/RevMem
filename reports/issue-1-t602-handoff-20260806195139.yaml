scope:
  - Implement ordered recovery after rebase or force-push.
  - Keep direct immutable Git evidence authoritative.
  - Reuse T601 snapshots only after old-object absence is proven.
  - Preserve stable file identity only for unique path/content evidence.
  - Fail closed for missing, corrupt, expired, malformed, contradictory or ambiguous evidence.
  - Connect recovery to the production Git document session and exact-head CI.
non_goals:
  - Schema migration and corruption quarantine owned by T603.
  - Cross-window locking and history atomicity owned by T604.
  - Comprehensive failure retry and privacy-safe diagnostics policy owned by T606.
  - Large-repository performance optimization owned by T607.
  - Merge, release, normal review or independent final review.

