findings:
  - id: T602-R003
    severity: medium
    origin: introduced_by_change
    location: implementation handoff and current completion evidence
    description: No updated implementation handoff transports the current implementation identity and finding dispositions.
    impact: A later worker can consume the stale initial handoff and use incorrect target/CI evidence.
    evidence: The initial handoff still targets 424fdd54; the follow-up adds only a prose report.
    required_action: Persist a new implementation handoff for the final fix HEAD and matching CI.
  - id: T602-R010
    severity: high
    origin: introduced_by_fix
    location: src/adapters/document-review-state/persisted-document-review-state-session-provider.ts open and enqueueSnapshotCommit
    description: open snapshot publication is outside the queue used by commit publication.
    impact: A delayed old open can overwrite the latest pointer after a newer commit, restoring already-unreviewed lines later.
    evidence: open directly awaits replaceSnapshots while only committer.commit calls enqueueSnapshotCommit.
    required_action: Order or generation-check open and commit publication for the same snapshot coordinates and add a reverse-completion test.
  - id: T602-R011
    severity: high
    origin: introduced_by_fix
    location: src/application/history-rewrite-recovery/adapters.ts containsCopyFrom
    description: Copy rejection uses raw exact string equality and misses quoted Git metadata paths.
    impact: A quoted-path copy can transfer stable identity and reviewed ranges to a copied file.
    evidence: The only test uses unquoted src/a.ts; canonical decoding is not used by containsCopyFrom.
    required_action: Structurally parse copy metadata and add quoted/escaped path tests.

