implementation:
  outcome: completed
  summary:
    - Added GitReviewContextResolver with stable branch identity and commit-keyed detached identity.
    - Added GitContextRevisionMapper that advances Context and Global snapshots through T203 and T204 mapping contracts.
    - Added PollingGitStateMonitor with deduplication, serialized polling, explicit scheduled-error handling, and retry after callback failure.
    - Added Git-aware document-session preparation before existing routed and reconciled providers.
    - Added persisted-path stable file-ID resolution for renamed documents.
    - Added complete revision diff support to the production Node Local Git adapter.
  behavioral_notes:
    - Detached contexts expose logical kind detached-commit but persist using the existing branch schema with refName HEAD@<commit>.
    - A failed monitor callback does not confirm the new baseline; a later poll retries the same transition.
    - Missing prior objects clear reviewed ranges instead of guessing continuity.
    - Binary sections are outside line review and do not abort mapping of text files.
