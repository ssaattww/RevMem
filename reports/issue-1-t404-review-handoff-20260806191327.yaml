findings:
  - id: T404-R001
    severity: blocking
    origin: introduced_by_change
    location: src/application/github-pr-context/github-pull-request-context-layer-store.ts:1-5; src/adapters/github/node-github-pull-request-context-layer-store.ts:11-33
    description: A second GitHubPullRequestContextLayer model and root-level JSON store bypass the existing ReviewContextState, FileReviewState, RepositoryGlobalState, and T104 manifest-last repository.
    impact: Existing commands, decoration, progress, Global state, original-side state, history, repository isolation, and T405 cannot share one authoritative state; AC-11/AC-21 core is not delivered on the product state path.
    evidence: No changed production file uses or extends T104 persistence; the new model omits stable file IDs, original ranges, content hashes, line counts, Global atomicity, and history.
    required_action: Use the existing pull-request ReviewContextState and T104 storage route/repository as the only source of truth; derive any list metadata from it and add integrated context/Global/original-side tests.
  - id: T404-R002
    severity: high
    origin: introduced_by_change
    location: src/adapters/github/node-github-pull-request-context-layer-store.ts:25-33
    description: upsert and remove perform unsynchronized read-modify-write operations without same-instance serialization or CAS.
    impact: Concurrent PR updates, revision updates, and removals lose layers in a single Extension Host before T604 cross-process concerns apply.
    evidence: Two operations can read the same document and publish conflicting complete replacements; T104-2 already provides storage-root serialization.
    required_action: Reuse T104 or serialize/CAS same-owner operations; add Promise.all and update/remove interleaving Red tests.
  - id: T404-R003
    severity: high
    origin: introduced_by_change
    location: src/adapters/github/node-github-pull-request-context-layer-store.ts:25-30; test/unit/github-pr-context-layer-store.test.ts:28-34
    description: A PR revision update replaces the entire caller-supplied layer and does not map or preserve existing state.
    impact: Metadata refresh can erase ranges, while replaying old ranges can mark changed lines as reviewed.
    evidence: The test resubmits identical files from its fixture, so it proves caller repetition rather than store continuity.
    required_action: Add an evidence-bound revision transition using existing mapping/fail-closed logic and tests for metadata-only updates, changed lines, rename, and mapping failure.
  - id: T404-R004
    severity: high
    origin: introduced_by_change
    location: src/application/github-pr-context/github-pull-request-context-layer-store.ts:7-20
    description: Context identity lowercases only host and accepts noncanonical/default ports, diverging from T202/T401 canonical identity.
    impact: The same GitHub.com PR splits between RevMem/revmem or github.com/github.com:443 contexts.
    evidence: Existing normalizeGitRemoteUrl lowercases GitHub.com path and canonicalGitHubAuthority removes default ports; new normalizeIdentity does neither.
    required_action: Reuse the canonical GitHubRepositoryIdentity path and test case/default/non-default/invalid-port variants.
  - id: T404-R005
    severity: high
    origin: introduced_by_change
    location: src/application/github-pr-context/github-pull-request-context-layer-store.ts:1-5,22
    description: The custom path/range record omits stable file identity and filesystem semantics, rejects valid POSIX backslash names, accepts invalid Windows/control paths, does not canonicalize adjacent intervals, and uses unsafe plain-object path keys.
    impact: Valid files may be lost, invalid or ambiguous files may be persisted, rename/original-side certainty metadata is lost, and special names such as __proto__ cannot be represented safely.
    evidence: Existing core FileReviewState and canonical path contracts already model these requirements; the new code reimplements only a subset.
    required_action: Reuse core LineInterval/FileReviewState and canonical semantics-aware path validation; use safe indexing and add POSIX, Windows, interval, and special-key tests.
  - id: T404-R006
    severity: medium
    origin: introduced_by_change
    location: src/application/github-pr-context/github-pull-request-context-layer-store.ts:17
    description: Normalization always forces closed or merged layer decorationEnabled to false.
    impact: T405 cannot persist a user-explicit closed PR layer enablement required by design rev4.
    evidence: The value is computed as state === open AND requested true on every save/load.
    required_action: Separate creation default from persisted user override and test closed-layer explicit enablement across restart.
  - id: T404-R007
    severity: high
    origin: introduced_by_change
    location: src/adapters/github/node-github-pull-request-context-layer-store.ts:33
    description: The claimed atomic publication writes and renames without file sync and uses a timestamp-only same-process temp suffix.
    impact: Successful state may be lost after a crash, and same-millisecond writes can collide.
    evidence: Design 15.2 and NodeAtomicTextFileStore require/open/sync/close/replace with a unique temp path.
    required_action: Reuse T104 atomic file/repository implementation or implement equivalent durable publication and failure-injection tests.
  - id: T404-R008
    severity: medium
    origin: coverage_miss
    location: test/unit/github-pr-context-layer-store.test.ts; package.json; reports/issue-1-t404-implementation-20260806185200.md; reports/issue-1-t404-handoff-20260806185200.yaml
    description: Tests and reports overstate identity/schema/persistence coverage, omit R001-R007 boundaries, and do not include T404 in the standard unit/full local suite.
    impact: Green CI does not protect the task's main contracts and the next worker receives stale HEAD/coverage evidence.
    evidence: The broad invalid-input test checks only HEAD and an inverted interval; T404 runs only through an ad-hoc CI step.
    required_action: Add Red tests for every finding, define test:t404 and wire it into standard regression, then publish evidence-faithful follow-up reports/handoff.

