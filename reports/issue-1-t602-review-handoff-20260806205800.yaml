findings:
  - id: T602-R001
    severity: high
    origin: introduced_by_change
    location: src/adapters/document-review-state/persisted-document-review-state-session-provider.ts
    description: Snapshot generation invalidation/publication is not coordinated with durable state commit.
    impact: Valid old evidence can be lost and a persisted commit can be reported as failed.
    evidence: invalidate then delegate commit then publish, without rollback or prepared generation.
    required_action: Use a two-stage generation switch and add failure-boundary tests.
  - id: T602-R003
    severity: medium
    origin: introduced_by_change
    location: PR body/comments and T602 implementation report/handoff
    description: Final HEAD and CI identities are stale and inconsistent.
    impact: Later workers can use validation from the wrong SHA.
    evidence: d1a2b5f current implementation versus f42bdb and 424fdd records.
    required_action: Synchronize all records to the post-fix implementation HEAD and exact matching CI.
  - id: T602-R004
    severity: high
    origin: introduced_by_change
    location: src/adapters/local-git/history-rewrite-local-git-adapter.ts
    description: rev-parse exit 128 is classified as missing revision.
    impact: Fatal Git failure enables fallback with incomplete evidence.
    evidence: Code accepts exit 1 or 128; design 9.2 forbids blanket 128 missing classification.
    required_action: Only exit 1 is missing; preserve all other failures and test them.
  - id: T602-R005
    severity: high
    origin: introduced_by_change
    location: history-rewrite-git-context-revision-mapper.ts and git-context-recovery.ts
    description: Candidate enumeration/read failures silently shrink the candidate set.
    impact: A remaining candidate can be falsely treated as unique.
    evidence: Exceptions and non-found results are dropped without unknown evidence state.
    required_action: Distinguish proven absence from unknown and reject cross-path recovery when candidate completeness is unavailable.
  - id: T602-R006
    severity: high
    origin: introduced_by_change
    location: src/application/history-rewrite-recovery/index.ts
    description: Cross-file identity is selected by non-empty surviving reviewed ranges.
    impact: An unrelated file retaining one reviewed line can be selected over the actual renamed file.
    evidence: Candidate filtering uses reviewedRanges.length greater than zero.
    required_action: Add a separate unique file-identity proof contract.
  - id: T602-R007
    severity: high
    origin: introduced_by_change
    location: src/application/history-rewrite-recovery/git-context-recovery.ts
    description: Context and Global can recover the same file ID to different destinations or only one side.
    impact: Atomic persisted snapshots become internally inconsistent.
    evidence: Independent loops and only per-map destination conflict checks.
    required_action: Resolve destination identity once and apply it consistently to both sides.
  - id: T602-R008
    severity: high
    origin: introduced_by_change
    location: snapshot recovery coordinator and adapter
    description: Snapshot envelope scope/file ownership is not validated by the mapping port.
    impact: A valid snapshot for another file can transfer reviewed ranges.
    evidence: map accepts only snapshotId/currentContent/now; Global mismatch does not necessarily discard the ID.
    required_action: Include expected scope/file ID in restore/map validation and test wrong-owner pointers.
  - id: T602-R009
    severity: high
    origin: introduced_by_change
    location: src/application/review-context/history-rewrite-git-context-revision-mapper.ts
    description: Availability precheck and direct mapper independently query object existence.
    impact: TOCTOU can skip fallback or override authoritative direct mapping.
    evidence: Separate objectExists observations drive separate decisions.
    required_action: Share one observation or return structured missing evidence from the direct mapper.
  - id: T602-R010
    severity: high
    origin: introduced_by_change
    location: persisted document provider and NonGitSnapshotTracker latest pointer
    description: Latest snapshot publication has no generation CAS or serialization.
    impact: An older reviewed snapshot can overwrite a newer unreviewed snapshot and later resurrect cleared ranges.
    evidence: setLatest is last-writer-wins and is not tied to repository transaction generation.
    required_action: Add generation-aware CAS/serialization and race tests.
  - id: T602-R011
    severity: medium
    origin: introduced_by_change
    location: src/application/history-rewrite-recovery/adapters.ts
    description: The new direct Git adapter can treat copy as a destination mapping and is not used by production recovery.
    impact: Test and production paths diverge; future wiring can violate the copy-unreviewed contract.
    evidence: oldPath-only selection ignores copy classification; coordinator injects a missing-object stub.
    required_action: Reuse the existing validated mapper or fully classify copy and wire one implementation path.

