finding_dispositions:
  - id: T404-R001
    severity: blocking
    disposition: closed
    evidence:
      - Parallel GitHubPullRequestContextLayer/path-range document was removed.
      - PullRequestReviewStateCommit uses existing ReviewContextState and RepositoryGlobalState.
      - Node adapter delegates to T104 FileSystemReviewStateRepository.
    residual_risk:
      - Actual persistence and history integration coverage remains under T404-R008.
  - id: T404-R002
    severity: high
    disposition: closed
    evidence:
      - Old unsynchronized read-modify-write store was removed.
      - T104 same-storage-root serialization and complete persisted-snapshot CAS are used within the service repository instance.
    residual_risk:
      - Cross-instance/window/process locking remains T604 scope.
  - id: T404-R003
    severity: high
    disposition: open
    location: src/application/github-pr-context/github-pull-request-context-layer-store.ts
    description: Revision mapping still handles Context only and commits the prior owner-wide Global state unchanged.
    evidence:
      - PullRequestRevisionMapper accepts current Context and next PR descriptor and returns only ReviewContextState.
      - update builds next.globalState by cloning current.globalState after a revision change.
      - requireMappedContext checks only context/repository IDs and top-level base/head SHA.
      - Existing GitContextRevisionMapper requires and returns complete Context and Global snapshots with immutable mapping evidence.
    impact:
      - Global currentRevisionId and file revisions remain stale after a PR head change.
      - A mapper can relabel top-level PR SHAs while leaving stale file evidence and reviewed ranges.
    required_action:
      - Change the mapper boundary to complete before/after PullRequestReviewStateCommit snapshots.
      - Use immutable diff/blob evidence, filesystem semantics, and mapping options.
      - Validate PR descriptor identity/lifecycle, every mapped file revision, Context revision, and Global revision before commit.
      - Add Red tests for Global mapping, changed lines, rename, ambiguity, binary, missing old object, and mismatched file revisions.
  - id: T404-R004
    severity: high
    disposition: open
    location: src/application/github-pr-context/github-pull-request-context-layer-store.ts
    description: GitHub authority canonicalization is independently reimplemented and create permits noncanonical or unreachable context IDs.
    evidence:
      - The implementation strips a final :443 before validating the whole authority.
      - A malformed authority such as ghe.example:8443:443 can alias ghe.example:8443.
      - create checks context kind and SHAs but does not derive and compare the canonical context ID from the PR descriptor.
      - T202/T401 canonicalGitHubAuthority and canonical remote policy are not reused.
    impact:
      - The same PR can split into multiple stored contexts or be stored under an ID that load(identity) cannot recover.
    required_action:
      - Reuse canonicalGitHubAuthority and the T202/T401 canonical repository identity policy.
      - Validate descriptor, context ID, and repository ID at create/update/load boundaries.
      - Add Red tests for malformed multi-port authority, default-port variants, and create identity mismatches.
  - id: T404-R005
    severity: high
    disposition: closed
    evidence:
      - Existing FileReviewState supplies stable file ID, current/previous paths, modified/original ranges, content hash, and line count.
      - Custom path-keyed interval persistence was removed.
    residual_risk:
      - Revision-mapping correctness remains T404-R003.
  - id: T404-R006
    severity: medium
    disposition: open
    location: src/core/contracts/review-state.ts; src/application/github-pr-context/github-pull-request-context-layer-store.ts
    description: Lifecycle persistence exists, but no persisted layer visibility contract represents closed-default false and explicit user override true.
    evidence:
      - PullRequestReviewContext records only open/closed/merged lifecycle.
      - ReviewContextState has no PR-layer enablement/default override field.
      - Tests verify closed metadata only, not default disable, explicit enable, or restart restoration.
    impact:
      - T405 can add a toggle UI but has no authoritative state to persist its value.
    required_action:
      - Separate lifecycle state from persisted user-selected visibility/decoration enablement.
      - Apply default false at closed/merged context creation while preserving explicit override.
      - Test default, override, restart, and reopen behavior.
  - id: T404-R007
    severity: high
    disposition: closed
    evidence:
      - The custom writeFile/Date.now temp/direct rename path was removed.
      - T104 NodeAtomicTextFileStore provides unique temp, file sync, close, replace, and failure cleanup.
    residual_risk:
      - Cross-process lock and directory durability remain T604 scope.
  - id: T404-R008
    severity: medium
    disposition: open
    location: package.json; .github/workflows/ci.yml; test/unit/github-pr-context-layer-store.test.ts; reports/issue-1-t404-review-followup-20260806194000.md
    description: Standard-unit wiring improved, but focused command, critical integration tests, test-first evidence, final evidence, and implementation handoff remain incomplete.
    evidence:
      - core-contracts.test imports the T404 test so standard unit executes it.
      - package.json still has no test:t404 script and CI uses a direct node invocation.
      - No actual T104 filesystem/restart/multiple-PR/CAS/history/failure test exists.
      - Follow-up report lacks Red commit/run/assertions, production fix ordering, final implementation HEAD, and exact-head CI run.
      - No schema-v3 implementation follow-up handoff corrects prior stale evidence.
    impact:
      - Green CI does not prove the remaining T404 contracts and a later worker cannot reconstruct TDD or final evidence reliably.
    required_action:
      - Add test:t404 and use it from CI.
      - Add actual T104 adapter, restart, multiple PR, CAS, history, identity, Global mapping, and closed override tests.
      - Record Red/Green commits and results, final implementation HEAD, exact-head CI, and a schema-v3 implementation handoff.

