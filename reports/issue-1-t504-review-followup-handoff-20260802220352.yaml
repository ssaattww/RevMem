findings:
  - id: T504-R1-P1
    severity: high
    origin: introduced_by_change
    location: src/core/global-understanding/global-understanding-progress.ts isCurrentGlobalFile()
    description: One-sided missing contentHash was accepted as current evidence.
    impact: Changed lines could be counted as reviewed and inflate Global understanding.
    evidence: Initial review report and Red run 30748905133; Green tests pass at 94a6a1c2.
    required_action: Require both hashes to exist and match; otherwise mark stale and numerator zero.
  - id: T504-R1-P2
    severity: medium
    origin: introduced_by_change
    location: src/adapters/repository-files/node-global-understanding-file-source.ts logical line analysis
    description: Zero-byte files returned lineCount 0 while VS Code/T501 can persist [0,1) for an empty document.
    impact: One current empty Global file could reject the repository recalculation.
    evidence: Initial review report and zero-byte Red/Green fixture.
    required_action: Return lineCount 1 and nonEmptyLines empty while retaining denominator zero.
  - id: T504-R1-P3
    severity: medium
    origin: introduced_by_change
    location: GlobalUnderstandingBackgroundRecalculator and NodeGlobalUnderstandingFileSource
    description: File-count chunking did not yield during synchronous work inside one large final file.
    impact: Extension Host event loop could be occupied for a long interval.
    evidence: Initial review report; deterministic single-file scheduler and 5-byte chunk tests.
    required_action: Bound decode/scan/hash work and cooperatively yield within a file.
  - id: T504-R1-P4
    severity: low
    origin: introduced_by_change
    location: reports/issue-1-t504-handoff-20260802211500.yaml
    description: A new writer emitted schema version 1 rather than required schema version 3.
    impact: Target identity, permissions, findings, validation and raw payloads were not standardized for lossless transfer.
    evidence: Historical v1 packet and this schema version 3 replacement packet.
    required_action: Regenerate the fix handoff as schema version 3 and preserve the legacy packet as a raw payload.

