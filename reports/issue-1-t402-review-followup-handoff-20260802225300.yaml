    severity: high
    disposition: addressed
    reviewed_head: 4c5f0dd87073ca1de3e4e559b0a07e7f890f7aae
    root_cause: Custom LCS accepted one of multiple optimal duplicate-line alignments because additions/deletions counts still matched API statistics.
    fix: Forward and suffix LCS evidence now proves one unique matching pair at every LCS rank; multiple optimal coordinate mappings fail closed as invalid-data.
    tests:
      - T402-R001 rejects content fallback when duplicate lines permit different optimal coordinates
  - id: T402-R002
    severity: high
    disposition: addressed
    reviewed_head: 4c5f0dd87073ca1de3e4e559b0a07e7f890f7aae
    root_cause: GitHub changed was collapsed to modified, nonstandard binary status was expected, and patchless zero-stat modified records were accepted without blob evidence.
    fix: Reject changed, send zero-stat modified records to content fallback, classify NUL or invalid UTF-8 raw content as binary, reject mixed text/binary and zero-stat text modified ambiguity, and preserve shared binary exclusion.
    tests:
      - T402-R002 rejects the GitHub changed status instead of treating a type change as modified
      - T402-R002 classifies patchless binary content and reaches the shared binary exclusion
  - id: T402-R003
    severity: medium
    disposition: addressed
    reviewed_head: 4c5f0dd87073ca1de3e4e559b0a07e7f890f7aae
    root_cause: Ordinary --find-copies did not consider unchanged source files, so pure copies were classified as added.
    fix: Run a conditional --find-copies-harder -l1000 second pass only when the ordinary diff contains added files; fail closed when Git skips exhaustive detection.
    tests:
      - T402-R003 detects a pure copy from an unchanged source with bounded harder copy detection
      - T402-R003 fails closed when Git skips exhaustive rename and copy detection
  - id: T402-R004
    severity: high
    disposition: addressed
    reviewed_head: 4c5f0dd87073ca1de3e4e559b0a07e7f890f7aae
    root_cause: Pagination validated origin and path but not monotonic page numbers, fixed per_page, request bounds, or empty-page chains.
    fix: Require page=current+1, per_page=100, exact query keys, maximum 30 pages, maximum 3000 files, and reject empty pages with next links.
    tests:
      - T402-R004 rejects page jumps and per-page changes in GitHub pagination links
      - T402-R004 rejects an empty-page next chain before it can issue unbounded requests

